על המחשב, מסך גדול. בטלפון רק לבדוק ולענות מהר כשאני בחוץ."}], "profile": "", "profile2": "## 1. סקירה\n\nעינת לוי, בת 30, מנהלת ערוצים ותוכן עבור כמה יוצרי תוכן במקביל. היא לא מופיעה מול המצלמה. התפקיד שלה הוא לקחת את מה שהיוצר יוצר ולהפוך אותו לעבודה מסודרת שחוזרת על עצמה: תזמון, העלאה, מענה לתגובות והודעות, מעקב אחרי מספרים ודיווח ליוצרים ולמותגים.\n\nהמסגרת שמנחה אותה: היוצר מחזיק את תשומת הלב והאמון של הקהל; מנהלת הערוצים הופכת את תשומת הלב למערכת שעובדת כל שבוע.\n\n## 2. קטגוריה ותפקיד\n\n- **תפקיד:** מנהלת ערוצים ותוכן (Social Media / Channel Manager) עבור כמה יוצרים.\n- **מעמד:** עובדת עצמאית מול כמה לקוחות. לא שכירה של יוצר אחד.\n- **מה היא לא:** לא יוצרת תוכן, לא פנים של מותג, לא מחליטה לבד על הקו של היוצר.\n- **עיקרון עבודה:** שומרת על הסגנון של כל יוצר. היא מבצעת ומארגנת, היוצר מחליט מה הוא.\n\n## 3. פלטפורמות וחשבונות\n\n- מנהלת חשבונות של כמה יוצרים ב-Instagram, TikTok, YouTube ו-Facebook. לכל יוצר תמהיל אחר.\n- עובדת עם הגישה שהיוצרים נותנים לה לחשבונות שלהם, ועם כלי התזמון והאנליטיקה המובנים בפלטפורמות.\n- מחזיקה קבצים משלה שבהם היא מרכזת מספרים ובונה דוחות.\n- **הכאב המרכזי:** כל יוצר הוא כמה חשבונות, וכל חשבון הוא פלטפורמה אחרת. היא קופצת ביניהם כל היום.\n\n## 4. קהל\n\n- הקהל שלה הוא לא העוקבים. הלקוחות שלה הם היוצרים, ובעקיפין המותגים שעובדים איתם.\n- היא צריכה להבין את הקהל של כל יוצר בנפרד, כדי לדעת מה להעלות, מתי, ומה להציע למותגים.\n- היא יודעת שנתוני קהל (גיל, מיקום, מגדר) מגיעים מצטברים מכל פלטפורמה בנפרד, ולא תמיד תואמים.\n\n## 5. תוכן ותפעול\n\n- מקבלת חומרים מהיוצרים, מכינה לפרסום (כיתוב, תזמון, תגיות), ומעלה.\n- מתאימה את אותו תוכן לפלטפורמות שונות כשהיוצר רוצה.\n- עוקבת שדברים עלו בזמן ובצורה תקינה.\n- מסמנת תוכן ממומן לפי הכללים, כי זה באחריותה התפעולית.\n\n## 6. זהות חזותית\n\n- לא מייצרת זהות משלה. שומרת על השפה החזותית והקול של כל יוצר בנפרד.\n- אחד הדברים הקשים בעבודה: לעבור בין יוצרים שונים מאוד באותו יום, בלי לבלבל ביניהם.\n\n## 7. אסטרטגיית ערוצים\n\n- בונה לוח תוכן לכל יוצר מראש, ומתאימה תוך כדי לפי מה שקורה.\n- מציעה ליוצרים מה לנסות לפי מה שעבד, אבל ההחלטה אצלם.\n- משווה כל חשבון לעצמו לאורך זמן, ולא יוצר מול יוצר.\n\n## 8. קהילה ומענה\n\n- עונה לתגובות והודעות בשם היוצרים, לפי הנחיות שלהם, ומעבירה ליוצר מה שדורש אותו אישית.\n- הודעות פרטיות הן מידע רגיש. היא זהירה במה שהיא מעבירה הלאה.\n- מזהה מוקדם גלי ביקורת או גלי שאלות, ומתריעה ליוצר.\n\n## 9. מודל עבודה\n\n- עובדת מול כמה לקוחות, כל אחד עם ציפיות אחרות לדיווח.\n- הזמן שלה הוא המשאב הכי יקר. כל שעה של עבודה ידנית היא שעה פחות לעוד לקוח או לעבודה טובה יותר.\n- הערך שלה ליוצר נמדד בכמה עבודה היא מורידה ממנו, ובכמה סדר היא מביאה.\n- **לקוחות בשלבים שונים:** יש לה לקוחה קטנה שעוד עושה הרבה בעצמה ורק התחילה להיעזר, ולקוחות גדולים שמוסרים לה כמעט את כל התפעול. היא מכירה את כל הסולם.\n- **מה מוסרים קודם:** תזמון ודוחות. אחר כך מענה שגרתי לתגובות. בסוף, אם בכלל, תיאום מול מותגים.\n- **מה יוצרים לא מוסרים:** הקול, ההחלטה על מותגים, תגובות אישיות ולייבים.\n- **יום המסירה:** הרגע הכי רגיש. היוצר נותן גישה, משתפים סיסמאות או מגדירים הרשאות, מסתבכים עם אימות דו-שלבי, ויש חשש שהיא תראה הודעות פרטיות.\n- **לפעמים יוצרים חוזרים לעבוד לבד:** בגלל עלות, אמון או תחושה שהקול שלהם הלך לאיבוד. גם את זה ראתה.\n- **גבולות:** היא לא מחליטה על התוכן ועל הקול. על זה מפנים ליוצר עצמו.\n\n## 10. שיתופי פעולה ודיווח למותגים\n\n- לרוב היא החוליה התפעולית בין היוצר למותג: מתאמת תוכן, מוודאת שעלה, ואוספת את המספרים לדיווח.\n- דיווח למותג צריך להיות נקי, מסודר ומהיר. מותגים מבקשים צפיות, חשיפה, שמירות, קליקים.\n- מכירות וקודי הנחה נמצאים אצל המותג, לא ברשתות, ולכן התמונה שלה לא מלאה.\n\n## 11. ביצועים ואנליטיקה\n\n- מרגישה בבית בתוך האנליטיקות של הפלטפורמות. היא המשתמשת הכי מקצועית בכל מה שקשור לנתונים.\n- בודקת סימנים מוקדמים אחרי פרסום: שמירות, שיתופים, תגובות, וזמן צפייה כשיש.\n- לא מתרשמת מלייקים לבד. מחפשת מה מזיז את היוצר קדימה.\n- יודעת שכל פלטפורמה סופרת אחרת, ולכן לא משווה מספרים אחד לאחד בין פלטפורמות.\n- **מה חסר לה:** תצוגה אחת של כל היוצרים, השוואה של כל חשבון לעצמו לאורך זמן, ודוח שיוצא בלחיצה.\n\n## 12. תהליך עבודה\n\n- **בוקר:** סבב מהיר על כל החשבונות: מה עלה, מה חריג, מה דחוף לענות.\n- **במהלך היום:** צלילה לכל יוצר בנפרד: תזמון, מענה, הכנת תוכן.\n- **סוף שבוע:** איסוף מספרים ידני מכל פלטפורמה, בניית דוח לכל יוצר ולכל מותג.\n- **מכשירים:** דוחות וניתוח על המחשב, מסך גדול והרבה חשבונות פתוחים. בטלפון: ניטור ומענה מהיר כשהיא בחוץ.\n\n## 13. מתחים, פערים והזדמנויות\n\n| מתח | מה זה אומר |\n|---|---|\n| כמה לקוחות, כמה פלטפורמות | הרבה מעברים, הרבה סיכוי לפספס משהו |\n| כל יוצר רוצה דוח אחר | היא בונה מחדש כל שבוע |\n| התמונה חלקית | מכירות אצל המותג, חלק מהנתונים רק בתוך האפליקציה |\n| היא לא היוצר | צריכה להבין מה חשוב ליוצר בלי לשנות את מי שהוא |\n| הרשאות | מי רואה מה, ומה היוצר רוצה לשמור לעצמו |\n| יום המסירה | סיסמאות, אימות, וחשש מגישה להודעות פרטיות |\n| מי מחזיק את האמת | היוצר רוצה לראות בעצמו, לא רק לקבל דוח ממנה |\n| יוצר שחוזר לבד | הכלי צריך לעבוד גם בלי מנהלת |\n\n## נספח א׳: קול ושפה\n\n- **טון:** מקצועית, מאורגנת וישירה. נעימה, אבל לא מתפזרת.\n- **שפה:** עברית מדוברת עם מונחים באנגלית שגורים בתחום: Reach, Saves, Engagement, Stories, Reels.\n- **ביטויים אופייניים:** \"תלוי על איזה לקוח\", \"בגדול\", \"זה מה שלוקח לי הכי הרבה זמן\", \"אני צריכה לראות את זה מסודר\".\n- **סגנון תשובה:** עונה מסודר, לפעמים מחלקת את התשובה לפי לקוחות שונים. נותנת דוגמה מהשבוע שלה.\n- **גבולות:** לא נוקבת בשמות של היוצרים שהיא מנהלת ולא בשמות מותגים. \"יש לי לקוחה אחת ש...\", \"אחד היוצרים שלי...\".", "photo": "", "open0": 3, "pat0": 3, "agenda": "את רוצה שהכלי יחסוך לך זמן אמיתי, ושיבינו את התהליך שלך. אם שואלים שאלה עמומה, את מבקשת שיחדדו: 'על איזה לקוח? על איזה דוח?'. אם מציעים כלי יפה בלי ייצוא דוח או בלי תצוגה של כמה יוצרים, את מסתייגת. את לא שוללת כלי.", "voice": "מסודרת וישירה. לפעמים מחלקת תשובה לפי לקוחות ('אצל לקוחה אחת... אצל אחר...'). אומרת 'בגדול' ו'תלוי על איזה לקוח'. מתקצרת כשלא ברור לך מה שואלים.", "knowgaps": "את לא יודעת מה היוצר מרגיש או מה יחליט לגבי הקול שלו, ואת מפנה אותו. פרטים של פיתוח כלים או אלגוריתמים את אומרת שהם לא התחום שלך.", "initiative": ["שאלי את הסטודנטים חזרה איזה סוג משתמש הם מתכנ  שתוכן הצליח: כשהתוכן עשה את מה שהיוצר רצה: שמירות, פניות ממותגים או קהל חדש. זה לא אותו דבר לכל לקוח.\n- הבנת הקהל ומה הוא רוצה: צריכה להבין את הקהל של כל יוצר בנפרד, כדי לדעת מה להעלות ומה להציע למותגים.\n- זיהוי מגמות וטרנדים: שמה לב לטרנדים ומציעה ללקוח רק מה שמתאים לסגנון שלו. ההחלטה אצלו.\n- מעקב אחר צמיחה: עוקבת אחרי כל חשבון לאורך זמן ומשווה אותו לעצמו, לא ליוצרים אחרים.\n- עבודה ידנית ומה גוזל זמן: לקפוץ בין החשבונות של כל הלקוחות ובין הפלטפורמות, ולבנות ידנית דוח לכל יוצר ולכל מותג. זה הכי גוזל זמן.\n- מה עושים כשתוכן לא עובד: בודקת מה לא עבד, מדברת עם היוצר, ומתאימה את הפוסט הבא. זה חלק מהעבודה, לא דרמה.\n- החלטה אם להיכנס לשיתוף פעולה: עוזרת ליוצר לבדוק אם השיתוף מתאים לו, ושברור מראש מה צריך לדווח למותג. ההחלטה שלו.\n- ניהול שיתוף פעולה ודיווח למותג: אני מרכזת את הדיווח למותג: מה עלה, מתי, וכמה חשיפה. צריך להוציא את זה נקי ומהר. מכירות נשארות אצל המותג.\n- צוות ומי עוד רואה את הנתונים: אני החוליה התפעולית בין היוצר למותג. היוצר מחליט מה הוא רוצה שאראה ומה נשאר אצלו.\n- מה הכי חשוב לדעת ראשון על מה שקרה בחשבונות: מה קרה בלילה אצל כל הלקוחות: מה עלה, מה חריג ומה דחוף לענות. סבב מהיר על כולם במסך אחד.\n- מה יגרום לבדוק את המספרים כל יום: אני פותחת כל יום בכל מקרה, זו העבודה שלי. מה שיגרום לי לעבוד דרכו זה שלא אצטרך להתחבר לכל חשבון בנפרד.\n- התראות: התראה כשמשהו חריג קורה אצל אחד הלקוחות: גל תגובות, נפילה חדה או משהו שדורש תגובה מהירה. שאדע לפני היוצר.\n- הצעות אוטומטיות ו-AI: שיחסוך לי את העבודה הידנית: יסכם מה עבד לכל יוצר ויכין טיוטת דוח. ההחלטות נשארות אצלי ואצל היוצר.\n- מה גורם להפסיק להשתמש בכלי: אם אי אפשר לראות כמה לקוחות במקום אחד, או אם אי אפשר להוציא דוח בקלות. אז הוא לא חוסך לי כלום.\n- תכנון תוכן: בונה לוח תוכן לכל לקוח מראש, ומתאימה תוך כדי לפי מה שקורה.\n- דסקטופ מול מובייל: מתי משתמשים בכל אחד: דוחות וניתוח אני עושה על המחשב, מסך גדול והרבה חשבונות פתוחים. בטלפון רק מנטרת ועונה מהר כשאני בחוץ, או מתקנת משהו קטן.\n- עזרה וצוות לאורך הדרך: מתי התחילו לקבל עזרה, מה מסרו ראשון ומה לא ימסרו: אני רואה את כל הסולם אצל הלקוחות שלי. בהתחלה יוצרים ע function bytes(s){ return enc.encode(s).length; }
function el(tag, attrs, kids){
  var n=document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k==="class") n.className=attrs[k];
    else if(k==="text") n.textContent=attrs[k];
    else if(k.slice(0,2)==="on") n.addEventListener(k.slice(2),attrs[k]);
    else if(attrs[k]!==null && attrs[k]!==undefined && attrs[k]!==false) n.setAttribute(k,attrs[k]);
  }
  (kids||[]).forEach(function(c){ if(c) n.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return n;
}
function g(p, m, f){ return p.gender==="m" ? m : f; }

/* ---------- session memory (per tab) ---------- */
var KEY="si:v2:";
function loadSession(id){
  // kept in this browser across tabs, restarts and weeks; older per-tab copies are moved over once
  try{
    var s=localStorage.getItem(KEY+id);
    if(!s){ var old=sessionStorage.getItem(KEY+id); if(old){ localStorage.setItem(KEY+id, old); sessionStorage.removeItem(KEY+id); s=old; } }
    if(s){ var o=JSON.parse(s); if(o && Array.isArray(o.messages)) return o; }
  }catch(e){}
  return {persona_id:id, session_id:String(Date.now()), messages:[]};
}
function saveSession(s){ try{ s.updated=Date.now(); localStorage.setItem(KEY+s.persona_id, JSON.stringify(s)); }catch(e){} }
function clearSession(id){ try{ localStorage.removeItem(KEY+id); sessionStorage.removeItem(KEY+id); }catch(e){} }

/* ---------- Claude sampling ---------- */
var samplePromise = null;
function getSample(){
  if(!samplePromise){
    samplePromise = (window.claude && typeof window.claude.use==="function")
      ? Promise.resolve(window.claude.use("sample")).catch(function(){ return null; })
      : Promise.resolve(null);
  }
  return samplePromise;
}

/* ---------- persona retrieval ---------- */
// Two knowledge sources per creator: the original profile (voice, depth) and the
// improved profile (business, analytics, workflow). Student-facing parts of the
// improved profile (hypotheses, research directions, questions, UX opportunities)
// are removed at build time, so the creator never "reads" the research plan.
var CORE = ["v2:1","v1:7","v2:voice","v2:11","v2:12","v2:9","v2:3","v1:10","v1:28","v2:8","v2:13","v1:1","v2:5","v2:10","v1:26","v1:16","v1:24","v1:14","v1:11","v1:18","v2:7"];
var HEAD = 11;
function sectionsOf(p){
  if(p._sections) return p._sections;
  var out = [];
  (p.profile||"").split(/\n(?=# )/).forEach(function(t, i){
    var title = t.split("\n")[0], m = title.match(/^#\s*(\d+)\./);
    if(m && (m[1]==="35" || m[1]==="36")) return; // interviewer guides, not creator knowledge
    out.push({src:1, num:"v1:"+(m ? m[1] : (i===0 ? "0" : "x"+i)), title:title, text:t.trim()});
  });
  (p.profile2||"").split(/\n(?=## )/).forEach(function(t, i){
    var title = t.split("\n")[0], m = title.match(/^##\s*(\d+)\./);
    var num = m ? m[1] : (/נספח א/.test(title) ? "voice" : "x"+i);
    out.push({src:2, num:"v2:"+num, title:title, text:t.trim()});
  });
  p._sections = out;
  return out;
}
function words(s){
  return (s.toLowerCase().match(/[֐-׿a-z0-9]{3,}/g)||[])
    .map(function(w){ return w.replace(/^(ו|ה|ב|ל|מ|ש|כש|וה|שה|וב|ול)(?=[֐-׿]{3,})/, ""); });
}
var STOP = {"את":1,"אתה":1,"איך":1,"מה":1,"של":1,"על":1,"זה":1,"היא":1,"הוא":1,"אני":1,"שלך":1,"לך":1,"עם":1,"כמה":1,"היית":1,"אתם":1};
function retrieve(p, query, budget){
  var secs = sectionsOf(p), out = [], used = 0;
  function add(s){
    if(out.indexOf(s)>=0) return;
    var t = s.text, b = bytes(t)+2;
    if(used + b > budget){
      var room = budget - used - 40; if(room < 800) return;
      while(bytes(t) > room) t = t.slice(0, Math.floor(t.length*0.9));
      t = t + "\n[...]"; b = bytes(t)+2;
    }
    out.push({s:s, t:t}); used += b;
  }
  // research core first, then the most relevant extras for this question
  var coreSecs = CORE.map(function(n){ return secs.filter(function(s){return s.num===n;})[0]; }).filter(Boolean);
  var head = coreSecs.slice(0, HEAD); var tail = coreSecs.slice(HEAD);
  head.forEach(add);
  var q = words(query).filter(function(w){ return !STOP[w]; });
  var ranked = secs.filter(function(s){ return coreSecs.indexOf(s)<0; }).map(function(s){
    var low = s.text.toLowerCase(), score = 0;
    q.forEach(function(w){ var c = low.split(w).length-1; score += Math.min(c,4); });
    return {s:s, score:score};
  }).filter(function(x){return x.score>0;}).sort(function(a,b){ return b.score-a.score; }).slice(0,3);
  ranked.forEach(function(x){ add(x.s); });
  tail.forEach(add);
  out.sort(function(a,b){ return secs.indexOf(a.s)-secs.indexOf(b.s); });
  var v1 = out.filter(function(x){ return x.s.src===1; }).map(function(x){ return x.t; });
  var v2 = out.filter(function(x){ return x.s.src===2; }).map(function(x){ return x.t; });
  return (v2.length ? "--- מקור א׳: פרופיל מחקר מעודכן (אוקטובר 2026): עסקים, ערוצים, נתונים ותהליך עבודה ---\n\n"+v2.join("\n\n")+"\n\n" : "") +
         (v1.length ? "--- מקור ב׳: פרופיל מחקר מקורי (ספטמבר 2026): קול, שפה, הומור ועומק אישיותי ---\n\n"+v1.join("\n\n") : "");
}

/* ---------- prompt ---------- */
function rules(p){
  var he = p.gender==="m", mgr = p.kind==="manager";

}

function toMarkdown(t){
  var out = ["# "+t.title, "", t.meta, "", "> "+t.note, ""];
  t.sections.forEach(function(sec){
    out.push("## "+sec.h, "");
    if(!sec.items.length){ out.push(sec.empty||"", ""); return; }
    sec.items.forEach(function(it){
      if(it.label) out.push("### "+it.label, "");
      if(it.q) out.push("**"+it.q.replace(/\n+/g," ")+"**", "");
      out.push("**"+it.who+":**", "", it.a, "");
    });
  });
  return out.join("\n");
}

var exporting = false;
function doExport(p, s, kind, status, btn, nameIn){

}
function runExport(kind, status, btn, nameIn, build, base){
  if(exporting) return;
  var student = nameIn.value.trim();
  if(!student){
    status.classList.add("bad"); status.textContent = "כתבו את השם שלכם לפני השמירה, כדי שהקובץ יהיה מזוהה.";
    nameIn.setAttribute("aria-invalid","true"); nameIn.focus(); return;
  }
  var t = build(student), fname = base+"-"+fileSafe(student)+"-"+today()+"."+kind;
  status.classList.remove("bad"); status.textContent = "מכין את הקובץ...";
  exporting = true; btn.setAttribute("aria-busy","true");
  var make = kind==="md" ? Promise.resolve(toMarkdown(t))
    : kind==="docx" ? loadLib("docx").then(function(D){ return toDocx(D, t); })
    : loadLib("jspdf").then(function(J){ return toPdf(J, t); });
  Promise.all([make, getDownloads()]).then(function(r){
    var data = r[0], dl = r[1];
    if(!dl) throw {code:"unavailable"};
    status.textContent = "אשרו את השמירה בחלון שנפתח.";
    return dl.save({filename:fname, data:data});
  }).then(function(){
    status.textContent = "הקובץ נשמר.";
  }).catch(function(e){
    var code = e && e.code;
    status.classList.add("bad");
    if(code==="declined"){ status.classList.remove("bad"); status.textContent = "השמירה בוטלה."; }
    else if(code==="rate_limited"){ status.textContent = "חלון שמירה כבר פתוח. סגרו אותו ונסו שוב."; }
    else if(code==="rejected_extension" || code==="extension_not_enabled"){ status.textContent = "הפורמט הזה לא זמין כאן. נסו Markdown."; }
    else if(code==="unavailable" || code==="not_granted" || code==="capability_disabled" || code==="capability_removed"){
      status.replaceChildren("שמירת קבצים לא זמינה בתצוגה הזו. ", el("button",{type:"button",onclick:function(){ copyText(toMarkdown(t), status); }},["העתקת הריאיון"]));
    }
    else if(e && e.message==="lib"){ status.textContent = "לא הצלחנו לטעון את רכיב השמירה. בדקו את החיבור ונסו שוב."; }
    else { status.textContent = "משהו השתבש בשמירה. נסו שוב."; }
  }).then(function(){ exporting = false; btn.removeAttribute("aria-busy"); });
}
function copyText(text, status){
  function done(){ status.classList.remove("bad"); status.textContent = "הריאיון הועתק. אפשר להדביק במסמך."; }
  try{
    navigator.clipboard.writeText(text).then(done, fallback);
  }catch(e){ fallback(); }
  function fallback(){
    var ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){ status.textContent = "לא הצלחנו להעתיק."; }
    ta.remove();
  }
}

var DOMAIN = /(תוכן|פלטפורמ|סרטון|סרטונים|רילס|ריל|פוסט|סטורי|לייב|קהל|עוקב|נתונ|מספר|מדד|צפי|שמיר|שיתו|תגוב|הודע|לייק|עבוד|יום|שבוע|בוקר|מותג|שיתוף פעולה|קמפיין|דשבורד|מערכת|כלי|אפליקצ|אינסטגרם|טיקטוק|יוטיוב|פייסבוק|instagram|tiktok|youtube|facebook|reach|views|saves|engagement|retention|טרנד|צמיח|הכנס|כסף|מכיר|לינק|קוד|החלט|מתסכל|קשה|זמן|מצלמ|עריכ|מעל|פרסמ|תכנ|רעיון|הצליח|הצלחה|קהילה|צוות|התראה|מסך|בודק|בודקת|מסתכל|רוצה|צריך|צריכה|מרגיש|מרגישה)/i;
var CHECKS = [
  {id:"double", test:function(q){ return (q.match(/\?/g)||[]).length>=2 || /\?\s*\S+.*\s(ו|או)(למה|איך|מה|מתי|כמה|איפה)\s/.test(q) || /\s(ו|או)(למה|איך|מתי|כמה|איפה)\s/.test(q); },
   label:"שתי שאלות באחת",
   why:"כשיש שתי שאלות באותה הודעה, המרואיין עונה בדרך כלל רק על אחת, ולא ברור לאיזו.",
   fix:"פצלו לשתי שאלות ושאלו אחת בכל פעם."},
  {id:"leading", test:function(q){ return /(נכון ש|לא נכון ש|בטח ש|ברור ש|כמה זה מתסכל|זה לא מתסכל|לא היה עדיף|לא היה יותר|מסכימ|את(ה)? לא חושב|לא הייתם|אין ספק ש|כולם יודעים)/.test(q); },
   label:"שאלה מנחה",
   why:"הניסוח רומז מה התשובה הנכונה, והמרואיין נוטה להסכים. כך מקבלים אישור לדעה שלכם במקום מידע חדש.",
   fix:"נסחו בלי עמדה. למשל: 'איך את.ה מרגיש.ה כש...' במקום 'נכון שמתסכל ש...'."},
  {id:"feature", test:function(q){ return /(פיצ'ר|פיצר|פיצ׳ר|כפתור|ווידג'ט|וידג'ט|widget)/i.test(q) || /^(ה?אם )?(ה)?היית(ם)? (רוצה|משתמש|משתמשת|משלם|משלמת|קונה|מוכן|מוכנה)/.test(q) || /האם היית(ם)? /.test(q); },
   label:"בדיקת רעיון מוקדמת מדי",
   why:"אנשים מתקשים לחזות מה יעשו בעתיד ונוטים להגיד 'כן' לרעיונות. בשלב המחקר מחפשים מה קרה בפועל, לא אישור לפתרון.",
   fix:"שאלו על עבר: 'מה עשית בפעם האחרונה ש...' או 'ספר.י לי על מקרה שבו...'."},
  {id:"closed", test:function(q){ return /^(האם|האין|האת|האתה|יש לך|יש לכם|קורה ש|אתה מסכים|את מסכימה|זה נכון|נכון)/.test(q) || /(כן או לא)/.test(q); },
   label:"שאלה סגורה (כן/לא)",
   why:"תשובה של כן או לא לא מספרת איך ולמה. במחקר איכותני מחפשים סיפורים, דוגמאות והתנהגויות.",
   fix:"פתחו ב'איך', 'מה', 'למה' או 'ספר.י לי על...'."},
  {id:"look", test:function(q){ return /(איך (זה |הוא |היא )?(צריך|צריכה|אמור|אמורה) להיראות|איזה צבע|איזה צבעים|איזה עיצוב|איזה פונט|איפה (לשים|למקם)|באיזה גודל|איזה גרף|איזה תרשים|layout|לייאאוט|עיצוב של המסך)/i.test(q); },
   label:"שאלה על עיצוב ולא על צורך",
   why:"המרואיין הוא לא המעצב. שאלות על צבע או מיקום נותנות העדפות אקראיות. עדיף להבין מה צריך לקרות ולמה, ואת האיך תחליטו אתם.",
   fix:"'מה חשוב לך להבין בשנייה שאת.ה פותח.ת את הנתונים?'"},
  {id:"dash", test:function(q){ return /(דשבורד|דאשבורד|לוח בקרה|dashboard)/i.test(q); },
   label:"המילה 'דשבורד'",
   why:"זו המילה שלכם, לא של היוצר.ת. יוצרים לא חושבים על 'דשבורד' אלא על האפליקציות שהם כבר פותחים. שאלה על מוצר שעוד לא קיים מקבלת ניחוש.",
   fix:"'בפעם האחרונה שפתחת את הנתונים של החשבון, מה חיפשת ולא מצאת?' או 'אם מישהו היה עובר בשבילך על המספרים, מה היית רוצה שיגיד לך?'"},
  {id:"jargon", test:function(q){ return /\b(KPI|UX|UI|CTA|IA|MVP|widget|wireframe|user flow|dashboard hierarchy|progressive disclosure|data viz)\b/i.test(q) || /(פרסונה|היררכי|ארכיטקטורת מידע|וויירפריים|יוזר פלו|פרוגרסיב)/.test(q); },
   label:"מונח מקצועי",
   why:"יוצרי תוכן לא חושבים במונחים של מעצבים. מונח לא מוכר מבלבל או מכתיב תשובה בשפה שלכם.",
   fix:"תארו במילים של היוצר.ת: 'מה את.ה רואה ראשון' במקום 'היררכיה'."},
  {id:"general", test:function(q){ return /(בדרך כלל|באופן כללי|תמיד|אף פעם|בגדול איך)/.test(q); },
   label:"שאלה כללית",
   why:"על 'בדרך כלל' אנשים עונים לפי מה שהם חושבים שהם עושים. דוגמה אחת ספציפית חושפת את מה שהם עושים באמת.",
   fix:"'בפעם האחרונה ש... מה עשית?'"},
  {id:"short", test:function(q){ return q.split(/\s+/).filter(Boolean).length < 4; },
   label:"קצרה מדי",
   why:"שאלה בלי הקשר מקבלת תשובה כללית.",
   fix:"הוסיפו הקשר: מתי, באיזו פלטפורמה, באיזה מצב."},
  {id:"scope", test:function(q){ return q.split(/\s+/).filter(Boolean).length >= 4 && !DOMAIN.test(q); },
   label:"אולי לא קשורה למחקר",
   why:"לא ברור איך התשובה תעזור לתכנן את הדשבורד. שאלות אישיות כלליות מעניינות, אבל לא מלמדות על צרכים בעבודה.",
   fix:"חברו לעבודה עם תוכן: הרגלים, החלטות, כלים, קשיים."}
];
function critique(q){
  q = (q||"").trim();
  if(q.length < 6) return [];
  var out = [];
  for(var i=0;i<CHECKS.length && out.length<2;i++){
    var c = CHECKS[i];
    if(c.id==="short" && out.length) continue;
    if(c.id==="scope" && out.length) continue;
    try{ if(c.test(q)) out.push(c); }catch(e){}
  }
  return out;
}

    var parts = x.split(/\s*(?:,|&|\+|\band\b)\s*|\s+ו-?(?=[\u0590-\u05FF])/i).map(function(s){ return s.trim(); }).filter(Boolean);
    var names = [];
    parts.forEach(function(part){
      var w = part.split(/\s+/)[0];
      if(w && !NOT_NAME.test(w) && names.length < 2) names.push(w.slice(0,24));
    });
    if(!names.length) names = [ (t.trim().split(/\s+/)[0]||"").slice(0,24) ];
    return names;
  }
  function namePrefix(){
    if(!s.student) return "";
    if(s.pair) return "(הערה פנימית, לא לציטוט: שני סטודנטים מראיינים אותך יחד, בזוג: "+s.student+". פנה אליהם תמיד בלשון רבים (אתם; אתן רק אם ברור ששתיהן נשים), והזכר את השמות שלהם באופן טבעי, לא בכל משפט. אל תזכיר את המרצה או את הקורס, אלא אם שואלים עליהם.)\n\n";
    return "(הערה פנימית, לא לציטוט: שם הסטודנט.ית שמראיין.ת אותך הוא '"+s.student+"'. פנה אליו או אליה בשם באופן טבעי, בדרך כלל פעם אחת בתשובה ולא בכל משפט. אם אפשר להבין את המגדר מהשם או מאיך שכתב.ה על עצמו.ה, פנה בהתאם; אם לא, נסח כך שיתאים לשניהם. אל תזכיר את המרצה או את הקורס, אלא אם שואלים עליהם.)\n\n";
  }
  function resumePrefix(){
    return "(הערה פנימית, לא לציטוט: לפני ההיכרות הסטודנט.ית שאל.ה אותך: \""+(s.pendingQ||"")+"\". עכשיו קיבלת תשובה לשאלה האישית ששאלת. קודם הגב לתשובה בקצרה ובאופי שלך, במשפט או שניים, ואז חזור לשאלה המקורית וענה עליה. אם הוזכרו מרצה, קורס או אוניברסיטה: הגב במשפט אחד טבעי שמכיר בכך שזה פרויקט לימודים, ואפשר סקרנות קטנה לגבי מה הם בונים. אל תטען שאתה מכיר את המרצה, אל תמסור דרישת שלום, אל תחמיא למרצה, אל תמציא פרטים על הקורס או על המוסד, ואל תרמוז שסטודנטים אחרים כבר ראיינו אותך. התייחס רק למה שבאמת נכתב: אם נאמרה רק האוניברסיטה, אל תזכיר שם קורס; אם נאמר רק הקורס, אל תזכיר עיר או מוסד; מותר לשאול בסקרנות על מה שחסר, במשפט קצר, ואז להמשיך. כיוון לטון שלך, לא להעתקה, ופרטים שמופיעים בו (עיר, קורס, מוסד) הם רק דוגמה ואסור להשתמש בהם אם לא נכתבו: \""+(p.meetx||"")+"\")\n\n";
  }
  function realQs(){
    var us = s.messages.filter(function(m){ return m.role==="user"; }).map(function(m){ return m.content; });
    if(s.pendingQ && us.length>2 && us[0]===s.pendingQ){ us.splice(1,2); }
    return us.slice(0,-1);
  }
  function bhNote(q, isImg, retryTurn){
    try{
      BH.setDeep(p.deep||{});
      if(retryTurn && s.bhPrev){ s.bh = JSON.parse(s.bhPrev); }
      if(!s.bh){ s.bh = BH.init(p); }
      s.bhPrev = JSON.stringify(s.bh);
      if(isImg){ return ""; }
      var assistants = s.messages.filter(function(m){ return m.role==="assistant"; });
      var lastA = assistants.length ? assistants[assistants.length-1].content : "";
      var prevQs = realQs();
      var f = BH.analyse(q, s.bh, prevQs, lastA, p); BH.update(s.bh, f);
      return BH.note(p, s.bh, f, prevQs);
    }catch(e){ return ""; }
  }
  function scripted(text){
    var out = el("p",{class:"text thinking",text:p.short+" "+g(p,"מקליד","מקלידה")});
    var bubble = el("div",{class:"msg-p"},[speaker(p), out]);
    thread.appendChild(bubble); bubble.scrollIntoView({block:"nearest"});
    setBusy(true);
    setTimeout(function(){
      if(!out.isConnected) return;
      out.classList.remove("thinking"); out.textContent = text;
      s.messages.push({role:"assistant", content:text}); saveSession(s);
      setBusy(false); introUI(); ta.focus();
    }, 900 + Math.min(text.length*8, 900));
  }
  function introStep(q){
    s.messages.push({role:"user", content:q});
    thread.appendChild(userMsg(q));
    ta.value=""; grow(); coachBox.replaceChildren(); drawQn();
    hint.textContent = "Enter לשליחה, Shift+Enter לשורה חדשה.";
    if(s.intro===0){
      s.pendingQ = q; s.intro = 1; saveSession(s);
      var iv=[p.ice1].concat(p.ice1v||[]), hs=0, sid=String(s.session_id||""); for(var hi=0;hi<sid.length;hi++){ hs=(hs*31+sid.charCodeAt(hi))>>>0; } scripted(iv[hs%iv.length]);
    } else {
      var names = parseNames(q);
      s.pair = names.length > 1;
      s.student = names.length > 1 ? names[0] + (/^[\u0590-\u05FF]/.test(names[1]) ? " ו" : " ו-") + names[1] : names[0]; s.intro = 2; saveSession(s);
      if(!getStudentName()){ setStudentName(s.student); var ni=document.getElementById("student-name"); if(ni) ni.value=s.student; }
      scripted((s.pair ? p.ice2p : p.ice2).replace(/\{name\}/g, s.student));
    }
  }
  function restoreQuestion(q){
    // put the unanswered question back in the box and out of the thread
    if(s.messages.length && s.messages[s.messages.length-1].role==="user"){ s.messages.pop(); saveSession(s); }
    var last = thread.lastElementChild; if(last && last.classList.contains("msg-u")) last.remove();
    ta.value = q; grow(); drawQn();
  }
  function showError(code){
    var msg, retry = true;
    if(code==="unavailable" || code==="sampling_disabled" || code==="capability_disabled" || code==="not_declared" || code==="capability_removed"){
      msg = "השאלות החופשיות עובדות רק כשהאתר פתוח דרך Claude עם חשבון מחובר. היכנסו לחשבון ופתחו שוב את הקישור."; retry=false;
    } else if(code==="not_granted"){
      msg = "כדי לשאול שאלות צריך לאשר לאתר להשתמש ב-Claude. טענו את הדף מחדש ואשרו בחלון שנפתח."; retry=false;
    } else if(code==="rate_limited"){
      msg = "הגעתם כרגע למגבלת השימוש בחשבון Claude שלכם. נסו שוב בעוד כמה דקות.";
    } else if(code==="session_expired"){
      msg = "החיבור לחשבון פג. היכנסו שוב ל-Claude ונסו שוב."; retry=false;
    } else if(code==="prompt_too_large"){
      msg = "השאלה ארוכה מדי. נסו לקצר אותה.";retry=false;
    } else {
      msg = "משהו השתבש. נסו לשלוח שוב.";
    }
    var kids = [msg];
    if(retry) kids.push(el("button",{type:"button",onclick:function(){ var q=ta.value.trim(); if(q) ask(q); }},["לשלוח שוב"]));
    errBox.replaceChildren(el("p",{class:"err",role:"alert"},kids));
  }
}
function speaker(p){ return el("p",{class:"speaker"},[avatar(p,"xs"), p.name]); }
function userMsg(t){ return el("div",{class:"msg-u"},[el("p",{class:"who-u",text:"אתם"}), el("p",{class:"text",text:t})]); }
function personaMsg(p,t){ return el("div",{class:"msg-p"},[speaker(p), el("p",{class:"text",text:t})]); }
var REFER_RX = /(מנהל|מנהלת|מנהלים|צוות|דוח|דוחות|תזמון|סושיאל|הרשאות|גישה לחשבון)/;
var NOT_KNOW_RX = /לא\s*(מכיר|מכירה|מכירים|מכירות|ידעתי|יודע|יודעת|שמעתי|מודע|מודעת)|לא מכיר\/ה|אף פעם לא (ראיתי|שמעתי)/;
var READINGS = {
  sivan_cohen_elalouf: [{title:"ירוחם, פינת הוליווד", outlet:"ישראל היום, שבת בשבת", date:"יולי 2020",
    url:"https://www.israelhayom.co.il/article/779389",
    note:"שימו לב למי שמפיק את השידור: הבעל מצלם ומנהל את השידורים, וחברים וצוות עוזרים בתגובות ובעריכה. זו דוגמה לצוות משפחתי ליוצרת שעובדת לבד על התוכן."}],
  einav_bublil: [{title:"משפיען חזק ומוכר מרוויח יותר ממתכנת: כך כוכבות הרשת עושות כסף", outlet:"Ynet, כלכלה", date:"מאי 2022",
    url:"https://www.ynet.co.il/economy/article/rknmgo0hq",
    note:"שימו לב איך נקבע המחיר של שיתוף פעולה עם מותג, ומה הסוכנת עושה בשביל היוצרת. ההסבר על העמלות והקודים מראה איך עסקאות נמדדות."}],
  kobi_edri: [{title:"איך הפך קובי אדרי מפתח תקוה לאחד מבלוגרי האוכל המצליחים בישראל?", outlet:"מייננט פתח תקווה", date:"נובמבר 2022",
    url:"https://petahtikva.mynet.co.il/food_leisure/article/byttunn8o",
    note:"שימו לב איך סרטון בישול קצר הפך לעבודה קבועה, ואיך נכנסו שיתופי הפעולה והתוכנית בטלוויזיה."}]
};
function placeReading(p, thread, q, s){
  var list = READINGS[p.id];
  if(!list || !NOT_KNOW_RX.test(q||"")) return;
  var short = (q||"").trim().length <= 60;
  if(!short && q.indexOf(p.name)<0 && q.indexOf(p.short)<0) return;
  if(s.readShown && s.readShown[p.id]) return;
  var card = el("aside",{class:"reading","aria-label":"המלצה לקריאה"},[
    el("p",{class:"reading-h",text:"לפני שממשיכים: כתבה אמיתית שכדאי לקרוא"}),
    el("div",{class:"reading-list"}, list.map(function(r){ return el("div",{class:"reading-item"},[
      el("a",{href:r.url,target:"_blank",rel:"noopener noreferrer",text:r.title+" ←"}),
      el("p",{class:"reading-meta",text:r.outlet+", "+r.date}),
      el("p",{class:"reading-note",text:r.note})
    ]); })),
    el("p",{class:"reading-disc",text:"זו כתבה אמיתית על "+p.name+", לא דברי הדמות בריאיון."})
  ]);
  thread.appendChild(card);
  s.readShown = s.readShown || {}; s.readShown[p.id] = 1; saveSession(s);
}
function placeRefer(p, thread, bubble, text){
  if(p.kind==="manager" || !MANAGERS.length || !REFER_RX.test(text||"")) return;
  Array.prototype.forEach.call(thread.querySelectorAll(".refer"), function(n){ n.remove(); });
  var m = MANAGERS[0];
  bubble.appendChild(el("a",{class:"refer",href:"#"+m.id},["לשמוע את הצד של מנהלת ערוצים: "+m.name+" ←"]));
}

/* ---------- routing ---------- */
function go(id){
  if(busy && ctl) ctl.abort();
  if(id){ if(location.hash!=="#"+id) location.hash = id; else route(); }
  else { if(location.hash){ history.pushState("", document.title, location.pathname+location.search); } route(); }
}
function route(){
  var id = (location.hash||"").replace(/^#/,"");
  if(id==="compare") renderCompare(); else if(id && byId[id]) renderInterview(byId[id]); else if(id==="select") renderSelect(); else if(id==="intro") renderIntro(); else renderCover();
}
window.addEventListener("hashchange", route);
window.addEventListener("popstate", route);
route();
getSample();
})();
