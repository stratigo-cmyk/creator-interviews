<title>ראיונות יוצרים</title>
<meta name="description" content="ראיונות איכותניים עם יוצרי תוכן סינתטיים, לקראת תכנון דשבורד ליוצרים">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=Heebo:wght@400;500;700;900&display=swap">
<style>
:root{
  --ground:#F5F6F7; --surface:#FFFFFF; --ink:#16181B; --muted:#565C64; --line:#DFE2E6; --line-strong:#C8CDD3;
  --user-bg:#ECEEF1; --danger:#A3262A; --focus:#1E5FBF;
  --acc-l:#2F5D8A; --acc-d:#8DB3DB; --accent:var(--acc-l); --on-accent:#FFFFFF;
  --tint: color-mix(in srgb, var(--accent) 12%, var(--surface));
  --font:"IBM Plex Sans Hebrew", "Assistant", "Arial Hebrew", "Segoe UI", Arial, sans-serif;
  --measure: 44rem;
  --heebo:"Heebo", "IBM Plex Sans Hebrew", "Arial Hebrew", Arial, sans-serif;
  --rose:#9B3A5C; --on-rose:#FFFFFF; --rose-tint:#F7E6EC; --ok:#2E6B4A; --ok-tint:#E3F0E8; --no:#8A3B2E; --no-tint:#F6E5E1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#131518; --surface:#1B1E22; --ink:#ECEEF0; --muted:#A4AAB2; --line:#2B3036; --line-strong:#3A4048;
    --user-bg:#23272C; --danger:#F08A8C; --focus:#8DB3DB;
    --accent:var(--acc-d); --on-accent:#131518;
    --rose:#F0A6BF; --on-rose:#1A1012; --rose-tint:#2E1D23; --ok:#8FD1AC; --ok-tint:#18291F; --no:#F0A897; --no-tint:#2E1C18;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#131518; --surface:#1B1E22; --ink:#ECEEF0; --muted:#A4AAB2; --line:#2B3036; --line-strong:#3A4048;
  --user-bg:#23272C; --danger:#F08A8C; --focus:#8DB3DB;
  --accent:var(--acc-d); --on-accent:#131518;
  --rose:#F0A6BF; --on-rose:#1A1012; --rose-tint:#2E1D23; --ok:#8FD1AC; --ok-tint:#18291F; --no:#F0A897; --no-tint:#2E1C18;
}
*{box-sizing:border-box}
/* ---------- cover + intro ---------- */
.cover{position:relative;min-height:100vh;min-height:100svh;display:grid;align-items:end;overflow:hidden;background:#2A1E24;color:#FFFFFF;font-family:var(--heebo)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(26,14,20,.88) 0%,rgba(26,14,20,.55) 34%,rgba(26,14,20,0) 62%)}
.cover .inner{position:relative;z-index:1;width:100%;max-width:72rem;margin-inline:auto;padding-block:40px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px;justify-items:start}
.cover .kicker{font-size:15px;font-weight:500;letter-spacing:.04em;opacity:.9}
.cover h1{margin:0;font-size:clamp(48px,11vw,128px);font-weight:900;line-height:.92;letter-spacing:-.01em;text-wrap:balance}
.cover .sub{margin:0;font-size:clamp(17px,2.2vw,22px);max-width:34rem;line-height:1.5;opacity:.95}
.btn-big{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:64px;padding:0 40px;border:0;border-radius:999px;font-family:var(--heebo);font-size:clamp(20px,2.4vw,24px);font-weight:700;cursor:pointer;text-decoration:none;transition:transform .15s ease,filter .15s ease}
.btn-big:hover{transform:translateY(-1px);filter:brightness(1.06)}
.btn-big:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.cover .btn-big{background:#FFFFFF;color:#2A1E24;margin-top:10px}
.intro{font-family:var(--heebo);padding-block:48px 72px}
.intro .wrap{max-width:46rem;display:grid;gap:28px}
.intro .eyebrow{color:var(--rose);font-weight:700;font-size:15px;letter-spacing:.04em}
.intro h1{margin:0;font-size:clamp(40px,7vw,68px);font-weight:900;line-height:1.02;text-wrap:balance}
.intro .body{margin:0;font-size:19px;line-height:1.7;max-width:38rem}
.intro .ask{margin:0;padding:22px 24px;border-radius:16px;background:var(--rose-tint);font-size:clamp(20px,2.6vw,25px);font-weight:700;line-height:1.45;text-wrap:balance}
.cases{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.case{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 20px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.case .tag{grid-row:span 2;font-size:14px;font-weight:700;padding:6px 12px;border-radius:999px;white-space:nowrap}
.case.no .tag{background:var(--no-tint);color:var(--no)}
.case.ok .tag{background:var(--ok-tint);color:var(--ok)}
.case.step .tag{background:var(--rose-tint);color:var(--rose);font-variant-numeric:tabular-nums;min-width:2em;text-align:center}
.case .pick{font-size:19px;font-weight:700;min-width:0}
.case .why{margin:0;font-size:17px;color:var(--muted);min-width:0}
.cast{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.cast li{display:grid;justify-items:center;text-align:center;gap:6px;padding:14px 8px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.cast .avatar{width:56px;height:56px}
.cast .n{font-weight:700;font-size:16px}
.cast .t{font-size:14px;color:var(--muted);line-height:1.35}
.intro .h2{margin:0;font-size:22px;font-weight:700}
.intro .go{display:grid;gap:12px;justify-items:start}
.intro .btn-big{background:var(--rose);color:var(--on-rose);min-height:72px;padding:0 48px}
.intro .note{margin:0;font-size:15px;color:var(--muted)}
@media (max-width:720px){.cast{grid-template-columns:1fr;gap:8px}.cast li{grid-template-columns:auto 1fr;justify-items:start;text-align:start;column-gap:14px;padding:10px 14px}.cast .avatar{grid-row:span 2;width:48px;height:48px}}
@media (max-width:600px){.btn-big{width:100%}.case{grid-template-columns:1fr}.case .tag{grid-row:auto;justify-self:start}}
@media (prefers-reduced-motion:reduce){.btn-big{transition:none}.btn-big:hover{transform:none}}

html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.65;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:var(--measure);margin-inline:auto;padding-inline:16px}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* app bar */
.appbar{border-bottom:1px solid var(--line);background:var(--surface)}
.appbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.brand{font-weight:600;font-size:15px;letter-spacing:.01em}
.brand small{font-weight:400;color:var(--muted);font-size:13px;margin-inline-start:8px}

/* select screen */
.select{padding-block:48px 64px}
.select h1{font-size:clamp(26px,4vw,34px);font-weight:700}
.select .lede{color:var(--muted);margin-top:8px;font-size:17px}
.plist{list-style:none;margin:32px 0 0;padding:0;display:grid;gap:12px}
.plist-h{margin:40px 0 0;font-size:18px;font-weight:700;color:var(--muted)}
.refer{display:inline-flex;align-items:center;margin-top:12px;padding:6px 12px;border:1px solid var(--line-strong);border-radius:999px;font-size:14px;color:var(--ink);text-decoration:none;background:var(--ground)}
.refer:hover{border-color:var(--ink)}
.refer:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.reading{background:var(--surface);border:1px dashed var(--line-strong);border-radius:14px;padding:16px 20px;display:grid;gap:8px;margin-top:-12px}
.reading-h{margin:0;font-weight:800;font-size:18px}
.reading-item{display:grid;gap:2px}
.reading-item a{font-weight:700;font-size:17px;color:var(--accent);text-decoration:underline;text-underline-offset:3px;width:fit-content}
.reading-meta{margin:0;font-size:14px;color:var(--muted)}
.reading-note{margin:2px 0 0;font-size:16px;line-height:1.6}
.reading-disc{margin:4px 0 0;font-size:13px;color:var(--muted)}
.plist-h + .plist{margin-top:12px}
.pcard{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;width:100%;text-align:start;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;cursor:pointer;
  transition:border-color .15s ease}
.pcard:hover{border-color:var(--accent)}
.pcard .pname{font-size:18px;font-weight:600}
.pcard .pcat{font-size:13px;color:var(--muted)}
.pcard .pline{margin-top:2px;color:var(--ink)}
.pcard .pbio{margin-top:8px;font-size:14px;line-height:1.55;color:var(--muted)}
.pcard .cta{font-weight:600;color:var(--accent);white-space:nowrap;font-size:15px}
.acc{--accent:var(--acc-l);--tint:color-mix(in srgb,var(--accent) 12%,var(--surface))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .acc{--accent:var(--acc-d)}}
:root[data-theme="dark"] .acc{--accent:var(--acc-d)}
.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:var(--tint);color:var(--accent);font-weight:700;font-size:18px;letter-spacing:.02em}
.avatar.sm{width:36px;height:36px;font-size:13px}
.avatar.xs{width:26px;height:26px;font-size:11px}
.foot{margin-top:28px;color:var(--muted);font-size:13px}

/* interview */
.ihead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.ihead .wrap{display:flex;align-items:center;gap:12px;min-height:60px;padding-block:8px}
.ihead .who{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.ihead .who h1{font-size:17px;font-weight:600}
.ihead .who p{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ihead .who > div{min-width:0}
.btn-ghost{background:none;border:1px solid transparent;border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--muted);font-size:14px;white-space:nowrap}
.btn-ghost:hover{color:var(--ink);border-color:var(--line)}
.btn-ghost.back{color:var(--ink);padding-inline-start:4px}
.btn-ghost .short{display:none}
.reset-box{display:flex;align-items:center;gap:6px;font-size:14px}
.reset-box .yes{color:var(--danger);font-weight:600}
.sysflag{margin:0 0 12px;border:1px solid color-mix(in srgb,var(--danger) 45%,transparent);border-inline-start:6px solid var(--danger);background:color-mix(in srgb,var(--danger) 9%,var(--surface));border-radius:10px;padding:14px 16px;display:grid;gap:8px;font-size:15px;line-height:1.6}
.sysflag:focus{outline:none}
.sysflag:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sysflag .sf-h{display:flex;gap:8px;align-items:center;font-weight:800;color:var(--danger);font-size:13px;letter-spacing:.03em;margin:0}
.sysflag .sf-ic{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--danger);color:var(--ground);font-size:13px;font-weight:900;line-height:1}
.sysflag .sf-t{margin:0;font-weight:800;font-size:18px;color:var(--ink)}
.sysflag p{margin:0;color:var(--ink)}
.sysflag .sf-k{font-weight:700}
.sysflag .sf-ex{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.sysflag .sf-actions{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:2px}
.sysflag .sf-edit{background:var(--danger);color:var(--ground);border:0;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer;min-height:40px;font:inherit;font-weight:700}
.sysflag .sf-send{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px 0;font:inherit;font-size:14px}
.sysflag .sf-src{font-size:12px;color:var(--muted)}

main.interview{padding-block:20px 12px}
.disclaimer{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface)}
.brief{background:var(--tint);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:16px}
.brief .brief-label{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.03em;margin-bottom:6px}
.brief .brief-text{font-size:16px;line-height:1.6}
.sect{margin-top:32px}
.sect > h2{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.ex{padding-block:20px;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.ex .qlabel{font-size:13px;color:var(--muted)}
.ex .q{font-weight:600;font-size:17px;margin-top:2px}
.turn-a{margin-top:12px}
.speaker{display:flex;align-items:center;gap:10px;font-size:clamp(19px,2.2vw,22px);font-weight:800;color:var(--accent);margin-bottom:10px}
.text{white-space:pre-wrap;unicode-bidi:plaintext;overflow-wrap:anywhere}
.yourturn{margin-top:40px;padding-top:24px;border-top:2px solid var(--line-strong)}
.yourturn h2{font-size:20px;font-weight:700}
.yourturn p{color:var(--muted);margin-top:4px}
.resume-note{margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line-strong)}
.resume-note p{margin:0;flex:1 1 280px;color:var(--ink);font-size:15px}
.thread{display:grid;gap:28px;margin-top:24px}
.msg-u{justify-self:stretch;max-width:100%;background:var(--user-bg);border-radius:14px;padding:16px 20px}
.msg-u .who-u{font-size:15px;font-weight:700;color:var(--muted);margin-bottom:6px}
.msg-u .text{font-size:18px;line-height:1.75}
.msg-p{max-width:100%;background:var(--surface);border:1px solid var(--line);border-inline-start:5px solid var(--accent);border-radius:14px;padding:16px 20px 18px}
.msg-p .text{font-size:18px;line-height:1.75}
.thinking{color:var(--muted);font-style:normal}
.thinking::after{content:"";display:inline-block;width:1.2em;text-align:start;animation:dots 1.4s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.note{font-size:13px;color:var(--muted);margin-top:6px}
.err{color:var(--danger);font-size:14px;margin-top:8px}
.err button{margin-inline-start:8px;background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;padding:0;font-weight:600}

/* composer */
.composer{position:relative;background:var(--ground);padding-bottom:12px;padding-top:4px;margin-top:32px}
.composer label{display:block;font-weight:800;font-size:clamp(22px,2.6vw,26px);line-height:1.3;margin-bottom:12px}
.box{display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:8px}
.box:focus-within{border-color:var(--accent)}
.box textarea{flex:1;border:0;background:transparent;resize:none;min-height:52px;max-height:200px;padding:8px 10px;font-size:17px;line-height:1.65;outline:none;unicode-bidi:plaintext}
.box textarea::placeholder{color:var(--muted);opacity:1}
.send{flex:none;background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer;min-height:44px}
.send[disabled]{opacity:.45;cursor:not-allowed}
.send.stop{background:transparent;color:var(--ink);border:1px solid var(--line-strong)}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}

.export{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.ex-label{font-size:14px;font-weight:600;color:var(--muted)}
#student-name{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:6px 10px;min-height:36px;width:12rem;max-width:100%}
#student-name:focus{border-color:var(--accent);outline:none}
#student-name[aria-invalid="true"]{border-color:var(--danger)}
.ex-btns{display:flex;flex-wrap:wrap;gap:8px}
.ex-btn{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:6px 14px;font-size:14px;font-weight:500;cursor:pointer;min-height:36px}
.ex-btn:hover{border-color:var(--accent);color:var(--accent)}
.ex-btn[aria-busy="true"]{opacity:.6;cursor:progress}
.ex-status{flex-basis:100%;font-size:13px;color:var(--muted);min-height:1em}
.ex-keep{flex-basis:100%;font-size:13px;color:var(--muted);margin:0}
.ex-status.bad{color:var(--danger)}
.ex-status button{background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;padding:0;font:inherit;font-weight:600}
.avatar.photo{object-fit:cover;padding:0;background:var(--tint)}
.optional-note{margin-top:20px;padding:12px 14px;border:1px dashed var(--line-strong);border-radius:10px;background:var(--surface);font-size:15px;display:grid;gap:6px}
.optional-note a, .tools a{color:var(--accent);font-weight:600}
.muted{color:var(--muted);font-size:14px}
.tools{margin-top:36px;display:grid;gap:10px}
.tools > h2{font-size:15px;font-weight:600;color:var(--muted)}
.tool{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tool > summary{cursor:pointer;padding:12px 14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;list-style-position:inside}
.tool-t{font-weight:600}
.tool-why{color:var(--muted);font-size:14px}
.tool-body{padding:0 14px 14px;display:grid;gap:10px}
.tool-body textarea{width:100%;font:inherit;color:var(--ink);background:var(--ground);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;line-height:1.55;unicode-bidi:plaintext}
.qn-list{margin:0;padding-inline-start:22px;display:grid;gap:8px}
.qn-row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.qn-text{unicode-bidi:plaintext}
.qn-done{font-size:13px;color:var(--muted);white-space:nowrap}
.qn-list li.done .qn-text{color:var(--muted)}
.qn-ask{min-height:30px;padding:3px 10px;flex:none}
.warn-note{font-size:14px;border-inline-start:3px solid var(--danger);padding-inline-start:10px}
.file-btn{justify-self:start;display:inline-flex;align-items:center}
.img-chip{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:6px}
.coach{margin-top:6px;font-size:13.5px}
.coach-line{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;color:var(--ink)}
.coach-tag{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--tint);color:var(--accent)}
.coach-q{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit;font-size:13px;font-weight:600}
.coach-more{margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:grid;gap:6px;color:var(--ink)}
.coach-fix{color:var(--muted)}
.cmp .cmp-set{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 14px;margin:20px 0 0;display:grid;gap:8px}
.cmp legend{font-weight:600;padding-inline:4px}
.cmp-creator{display:flex;align-items:center;gap:8px;cursor:pointer}
.cmp-q{display:flex;align-items:flex-start;gap:8px;cursor:pointer;unicode-bidi:plaintext}
.cmp-q input,.cmp-creator input{margin-top:4px;accent-color:var(--accent)}
.cmp textarea{width:100%;font:inherit;color:var(--ink);background:var(--ground);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px}
.cmp-run{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px}
.cmp-h{font-size:20px;margin-top:32px}
.cmp-row{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.cmp-row .q{font-weight:600;font-size:17px}
.cmp-grid{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:12px;margin-top:10px}
.wrap.cmp{max-width:74rem}
@media (max-width:760px){.cmp-grid{grid-template-columns:1fr}}
.cmp-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.sel-extra{margin-top:20px}

מבלבל? מבלבל."}, {"dim": "pain_point", "q": "מה הכי מתסכל אותך היום כשאתה מנסה להבין מה עובד ומה פחות בין TikTok, Instagram ו-YouTube?", "a": "שכל אחד סופר אחרת. צפייה בטיקטוק זה לא צפייה באינסטגרם, ויוטיוב בכלל חי בקצב אחר. אז יש סרטון שעף בטיקטוק ובאינסטגרם עשה כלום, ואני לא יודע אם המנה לא עבדה או שהפלטפורמה לא עבדה. זה ההבדל שמעניין אותי, ואין לי איפה לראות אותו.\n\nודבר שני, אני אגיד את זה ישר: אין שום מקום שמראה לי אם אנשים באמת בישלו. צפיות? הרבה. הרבה. הרבה. אבל אני מתכונאי, לא רק בדרן. אם המון ראו ואף אחד לא נכנס למטבח, משהו פה לא סגור לי. היום אני מנחש את זה מתגובות ומהודעות, כל פלטפורמה לבד. לנחש זה לא שיטה."}, {"dim": "desired_outcome", "q": "אם היה לך מישהו שעובר בשבילך על המספרים מכל הערוצים, מה היית רוצה שיגיד לך כל בוקר?", "a": "שיגיד לי איזה מתכונים שלי באמת נכנסו למטבח. אני יודע שאף פלטפורמה לא סופרת מי בישל, אז שיחבר לי את הסימנים: כמה שמרו, כמה כתבו 'הכנתי', כמה נכנסו למתכון המלא באתר. זה הראשון. לא 'ביצועים', מה באמת בישלו.\n\nאחר כך הסדרה של העצלנים. זה פורמט שחוזר, אז אני רוצה לראות אם הצופים נשארים עד הסוף כמו פעם, או שהם מתחילים לברוח לפני שאני משתעמם. ודבר שחשוב לי כשיש שיתוף עם מותג: לראות אם הסרטון הזה החזיק כמו סרטון רגיל שלי. אם הוא עבד בגלל המותג או למרות המותג.\n\nואת כל זה בשנייה, בזמן שאני שותה קפה. לא לחפור. מבין, יוצא לבשל."}], "profile": "# קובי אדרי: פרופיל מחקר עומק לקראת שאלון משפיען\n\n**Creator Intelligence Profile | מחקר מספר 01** \n**תאריך המחקר:** 27/09/2026 \n**שפה:** עברית | **מטרה:** הבנת הדמות הציבורית והכנת תשתית לראיון עומק \n**מסגרת:** UXR, ניתוח תוכן, Netnography מוגבלת, Personas, JTBD וניתוח מותג \n**מסמך מנחה:** israeli_influencer_deep_profile_research_prompt_he.md\n\n> זהו מחקר שולחני על תוכן ציבורי. הוא אינו ראיון עם קובי אדרי, סקר עוקבים או אבחון אישיות. המסקנות מתארות פרסונה ציבורית. פרסונות הקהל הן Proto-personas לבדיקה. בהתאם לפרומפט, המסמך כולל מפת הכנה לשאלון ולא ראיון מלא או תשובות מדומיינות בשמו.\n\n**מקרא:** **עובדה** = נתון שניתן לאמת במקור; **דיווח עצמי** = אמירה פומבית של אדרי; **תצפית** = מה שנמצא בחומר שנבדק; **הסקה מחקרית** = פרשנות לראיות; **השערה לבדיקה** = אפשרות שדורשת מחקר נוסף. רמות הביטחון מתייחסות לטענה המסוימת, לא לאמינותו של האדם.\n\nההפניות וכו׳ מפנות לרשימת המקורות המקושרת בפרק 37. כל המקורות נגישו בתאריך המחקר, אלא אם צוין שניסיון הגישה היה מוגבל.\n\n# 1. תקציר מנהלים\n\nקובי אדרי הוא יוצר תוכן קולינרי ומתכונאי שהזהות הציבורית שלו מחברת בין ידע מעשי במטבח, אוכל המזוהה עם בית ומשפחה, ושפה קומית שקל לזהות. באתרו הוא מציג את עצמו דרך הבישול והשפה גם יחד. הניתוח מציע שהבטחתו לקהל מורכבת משתי שכבות: לקבל רעיון שאפשר לבצע, ולהרגיש שמותר להיכנס למטבח בלי להתנהל כמו איש מקצוע. זו הסקה מחקרית על בסיס התוכן וההצגה העצמית, לא תוצאה של סקר קהל.\n\nנקודת המוצא להבנתו היא ההבדל בין פשטות ההגשה לבין מורכבות המנה. הארכיון כולל אוכל יומיומי, תבשילים ממושכים, מאפים ומנות חג. לכן התיאור ״מתכונים מהירים״ אינו מספיק. הצעה מדויקת יותר היא הפיכת בישול שנתפס כמאיים לרצף פעולות שנראה אפשרי. סדרת ״אתם פשוט עצלנים״ יוצרת מסגרת מוכרת שמאפשרת להחליף את המנה בלי להחליף בכל פעם את חוזה הצפייה. מספרי הפרקים ושמותיהם מלמדים על פורמט מתמשך, אך אינם מלמדים לבדם כמה אנשים חוזרים אליו.\n\nהשפה פועלת כאן כנכס זיהוי וגם ככלי הדרכה. ביטויים קצרים, פנייה ישירה וחזרות קוליות מחברים בין מתכון לבין הופעה. במתכון כתוב מופיעה למשל כפילות של הוראת ערבוב, המכניסה קצב דיבור לתוך טקסט שימושי. בממשק החיפוש באתר, קולו של המותג מגיע גם לכפתורים ולהזמנה להקליד. ההסקה היא שהדמות אינה נשענת רק על הופעתו מול מצלמה: חלק ממנה יכול להישמר גם כשהמשתמש קורא הוראות או מחפש ארוחת ערב.\n\nהחום המשפחתי אינו רק קישוט ביוגרפי. קטגוריית מאכלי הילדות והגרסה העכשווית לשופלור של סבא מציבות זיכרון בתוך מוצר תוכן שימושי. לצד זה, שילובים כמו מאפה גיאורגי לפורים מצביעים על חופש לשנות צורה והקשר. היפותזת הזהות היא ״מתרגם של מטבח ביתי להווה״: מסורת מספקת משמעות, ואילו פורמט, מכשיר או פתרון הגשה מאפשרים שימוש חדש. אין בכך הוכחה שהוא רואה עצמו כשומר מסורת במובן רחב או אידאולוגי.\n\nהתמונה החזותית מורכבת יותר מתווית אחת כמו ״עממי״ או ״מלוטש״. בשני צילומי מנות שנבדקו האוכל תופס את מרכז הפריים, בכמויות שמתאימות להגשה משותפת, עם רקע בהיר וטקסטורה מודגשת. לעומתם, איור הדמות באתר מציג הבעה מוגזמת, טלפון ואוכל בתנועה. ההסקה היא חלוקת תפקידים: ההגזמה מושכת ומזהה; צילום המנה מציג תוצאה שאפשר לרצות להכין. המדגם אינו מאפשר לקבוע שכך נראה כל הפיד או לתאר את קצב העריכה בכל סרטוניו.\n\nמחקר הקהל מחייב כאן זהירות. נקראו שתי קבוצות תגובות באמצעות אתר תצוגה צד שלישי, ללא אימות מלא בתוך אינסטגרם. הן כוללות שאלות התאמה, חיבה, כוונת הכנה וגם הסתייגות מהמאמץ. אלה רמזים שימושיים לצרכים, לא התפלגות מייצגת. לכן הדוח מפריד בין מבשל שמחפש פתרון, צופה שמחפש הנאה, ומשתמש שרוצה ביטחון והכוונה. לא נקבעו גיל, מגדר, הכנסה או גודל יחסי לכל קבוצה.\n\nהמסחריות היא חלק גלוי מהתוכן שנבדק: חומר גלם, כלי או מכשיר יכולים להיות משולבים בתוך פתרון קולינרי. השאלה המחקרית החשובה אינה אם הופיע מותג, אלא האם הצופה מקבל ערך גם כאשר אינו קונה את המוצר המסוים. לקראת הראיון כדאי להתמקד בדוגמאות ממשיות: מתכון ששונה בעקבות תגובה, רעיון מסחרי שנדחה, או משפט שהפסיק לעבוד. כך אפשר לברר החלטות וגבולות בלי להסתפק בתיאור עצמי כללי.\n\nבסיכום הניתוח, אדרי מתאים לקריאה כדמות של מדריך נגיש ובדרן קולינרי, עם שורשים מקצועיים ורגשיים. הביטחון גבוה בזיהוי עולם התוכן והשפה; בינוני בפרשנות למנגנון הקרבה; ונמוך יותר בהערכת מניעי הקהל. מפת הראיון צריכה לבדוק במיוחד את הפער בין תחושת קלות למאמץ אמיתי, בין זיהוי קבוע להתחדשות, ובין שירות לקהל לעבודה עבור מותגים. אלה צירי בירור, לא קביעות על קונפליקט פנימי.\n\n## בסיס המחקר ומגבלותיו\n\n**שאלת המחקר:** איזו מערכת יחסים אדרי מציע לקהל באמצעות תוכן, שפה ועיצוב, ואילו צרכים היא עשויה לשרת?\n\n- נקראו עמודי אתר רשמי, ארכיונים ומתכונים; ראיונות וכתבות מתקופות שונות; עמודי מותגים ומדיה; ומקורות משניים לזיהוי ערוצים.\n- נערכה בדיקה חזותית ישירה של שני צילומי מנות, איור האתר ותצלום אחד מכתבת עיצוב. האחרון מציג חלל מגורים, ולא שימש ראיה לזווית צילום במטבח.\n- נקראו **30 תגובות מוצגות בשני עמודי תצוגה צד שלישי**, 15 בכל עמוד. זה אינו כלל התגובות, אינו מדגם אקראי ואינו מאפשר חישוב סנטימנט או דמוגרפיה.\n- אינסטגרם וטיקטוק לא החזירו תוכן מלא. YouTube החזיר מעטפת ערוץ; ניסיונות פתיחת סרטונים לא אפשרו צפייה מלאה. **לא בוצע ניתוח אודיו או צפייה רציפה בקורפוס וידאו.**\n- הראיון של מאקו נקרא בגרסתו הכתובה. אין כאן טענה להאזנה לפרק המלא. Stories היסטוריים מתוארים רק כאשר מקור נגיש מתייחס אליהם.\n- תאריך סריקת עמוד אינו תאריך יצירת הפוסט. תאריכי תצוגה של צד שלישי מסומנים בהתאם; עמודים ללא תאריך אינם משויכים אוטומטית לספטמבר 2026.\n\n**שיטה:** דגימת שונות מכוונת, קידוד נושאי של שפה/משימה/רגש/מסחריות, חיפוש דוגמאות נגדיות, והשוואת הצגה עצמית למוצרים בפועל. לא נערכו ראיונות משתמשים או בדיקות שימושיות, ולא נמדדו שיעורי הצלחה בהכנת מתכונים.\n\n# 2. מי האדם?\n\n**זיהוי: ביטחון גבוה.** מדובר בקובי אדרי, יוצר התוכן הקולינרי המזוהה עם חשבון Instagram בשם `edrikobi`, אתר `kobiedri.co.il` וערוץ `kobi edri’s food`. הקישורים החברתיים מופיעים באתרו. אין לערבב בינו לבין אנשים אחרים בעלי אותו שם, או עם איתי אדרי, אחיו התאום, שגם הוא יוצר בתחום האוכל.\n\n**רקע ציבורי:** ילדות בירושלים, למידה במטבח המשפחתי, עבודה מקצועית באוכל, בישול בצבא, מסעדנות בארצות הברית וזכיינות בישראל. לפי סיפורו, המעבר לתוכן ברשת החל בקורונה בעקבות יוזמה של בתו. ביוגרפיה זו מספקת רצף של ניסיון לפני הפרסום, ולא רק הצלחה בפלטפורמה.\n\n**דיוק מקצועי:** בתקשורת משתמשים גם בכינוי ״שף״; לתיאור המחקרי עדיף ״מתכונאי ויוצר תוכן קולינרי בעל ניסיון במסעדנות״. לא אומתה הכשרה פורמלית מסוימת. גיל 41 הופיע בראיון ממאי 2026; אין ממנו הסקה לתאריך לידה מדויק.\n\n**תפקיד ב-Creator Economy, הסקה בינונית:** הוא מחבר בין ייצור ידע קולינרי, בידור, הפצת תוכן ועבודה מסחרית. לא אומתו סוכנות ניהול נוכחית, מבנה צוות או חלוקת תפקידים קבועה.\n\n# 3. נוכחות דיגיטלית\n\n| ערוץ | זיהוי ומצב אימות | תפקיד נתמך או משוער | פורמטים, טון וקהל | תדירות ואינטימיות |\n|---|---|---|---|---|\n| Instagram | מקושר מהאתר; גישה ישירה מוגבלת | מתכונים, נראות אישית ותוכן מסחרי | כתוביות מתכון והפניות ל-Reels/Stories במקורות | אין מדידה עדכנית; מידת הקרבה לא נמדדה |\n| TikTok | מקושר מהאתר; גישה מוגבלת | ערוץ הפריצה לפי דיווח עצמי | אוכל והומור; אין מדגם השוואתי מלא | אין תדירות או פילוח מאומתים |\n| YouTube | שם הערוץ אושר; תוכנו לא נטען במלואו | ערוץ הפצה נוסף | אין בסיס ל חין ביניהן.\n\n# 6. Creator DNA\n\n**הסקה מסכמת, ביטחון בינוני-גבוה:** יחידת התוכן הטיפוסית שניתן להסיק מהמדגם מחברת משימה קולינרית עם סימן זיהוי לשוני. ההגשה מאפשרת להרגיש קרובים למדריך גם כשהמנה דורשת מיומנות.\n\n## עשרת חוקי ה-DNA\n\n1. להשאיר לצופה תוצאה קולינרית ברורה, ולא רק הופעה.\n2. להפוך הוראה לשפה שאפשר לזכור ולהגיד בקול.\n3. להשתמש בפורמט חוזר כדי לייצר היכרות.\n4. לחבר חידוש למנה, מרכיב או מצב מוכרים.\n5. לאפשר לדימוי של אוכל משותף לשאת חלק מהרגש.\n6. לשלב ידע מעשי בתוך ההבטחה הקלילה.\n7. להחזיק גם הומור וגם שימושיות באותו נכס תוכן.\n8. לתת למותג מסחרי תפקיד בתוך הפעולה כשיש התאמה.\n9. לתרגם את קול הדמות גם לטקסט ולממשק.\n10. להשאיר את שאלת הקלות פתוחה לבדיקה אצל המבשל בפועל.\n\nאלה עקרונות אנליטיים, לא הוראות שאדרי מסר ולא נוסחה שהוכחה בניסוי. הבסיס המצטבר:.\n\n# 7. שפה ו-Tone of Voice\n\n## מבנה הקול\n\n**תצפית:** במתכונים שנקראו יש עברית מדוברת בתוך הוראות מקצועיות: פעלים ישירים, תיאורי מרקם, חזרות והבטחות הנאה. לצד הכמויות המדויקות מופיעים ניסוחים חושיים כמו השחמה ורכות. ההסקה היא מעבר רצוף בין ״כך עושים״ ל״כך זה ירגיש״.\n\n**הבחנה:** שפה המופיעה באתר אינה בהכרח תמלול מילה במילה של אדרי. לא ידוע מי עורך את הטקסטים. היא כן מייצגת את הקול המפורסם בנכס הרשמי.\n\n| סוג | דוגמה קצרה או דפוס | תפקיד משוער | מעמד |\n|---|---|---|---|\n| משפט מזוהה | ״קשה? לא קשה!״ | סגירת חשש והשלמת טקס | מתועד במספר מקורות |\n| משחק צלילי | ״יאבלולו שמבלולו״ | זיהוי והנאה מהצליל | מתועד באתר |\n| שם לפעולה | ״צ׳לה בלה״ | הכנסת פעולה לשפה אישית | מוזכר בראיון |\n| כלי כסימן זיהוי | ״תקנו סוטאז׳״ | חיבור בין כלי, משפט והרגל | מתועד בכתבת העיצוב |\n| פנייה מתגרה | שם סדרת העצלנים | אתגר קליל שמזמין להוכיח יכולת | פרשנות לשם הפורמט |\n| חזרה | ״ערבב ערבב״ | הדגשת פעולה וקצב | מופיע במתכון |\n| מינון מוגזם | ״הרבה. הרבה. הרבה.״ | קצב והדגשת שפע | תצוגת פוסט משנית |\n| פתיח | זיהוי מנה, פרק או צורך | התמצאות מהירה | בארכיון ובטקסטים |\n| סיום | איחול אכילה והנאה | מעבר מהדרכה לשולחן | בכמה מתכונים |\n| CTA | הזמנה לחפש, להכין או לעבור למתכון | להפוך צפייה לפעולה | אתר ומתכונים |\n| מילים מושאלות | שמות מנות, ״קריספי״, ״פטנט״ | תיאור מוכר ושימושי | אין בסיס לכמת code switching |\n| פיסוק | שאלות, סימני קריאה ופסקאות פעולה קצרות | תחושת דיבור | המדגם אינו אחיד |\n| אימוג׳י והאשטגים | האשטגים עם ביטויי הזיהוי בתצוגת פוסט | קישור בין מותג לתוכן | מקור משני בלבד |\n| מילות חיבור | רצף פעולות ותוצאות | הכוונה פרוצדורלית | אין מילת חיבור ייחודית מאומתת |\n\nלא נמצא מספיק חומר לטעון לשימוש קבוע בקללות, פלרטוט, סרקזם, לעג עצמי או שפות זרות. אין תיעוד מספק של הפסקות, גובה קול או תזמון קומי באודיו.\n\n## Voiceprint פרשני\n\nהסקאלות מתייחסות לטקסט הפומבי שנקרא. זהו כלי עבודה לראיון, לא מדידה פסיכומטרית.\n\n| ציר: 1 עד 10 | הערכה | נימוק | ביטחון |\n|---|---:|---|---|\n| רשמי → יומיומי | 9 | שפה מדוברת והוראות קצרות | גבוה |\n| מרוחק → מקרב | 8 | פנייה ישירה והזמנה לביצוע | בינוני |\n| רציני → משחקי | 8 | משחקי צליל ומסגור קומי | בינוני-גבוה |\n| מאופק → מוחצן בטקסט | 8 | הגזמה וחזרות | בינוני |\n| מומחה → חברי | 7 | מומחיות מעשית בניסוח בלתי טקסי | בינוני |\n| מתוכנן → ספונטני | ללא ציון | הטקסט אינו מגלה כמה תוכנן מראש | חסר בסיס |\n\nהציון בציר מומחה/חברי אינו אומר שחברותיות מפחיתה מומחיות. הוא מתאר את אופן ההצגה בלבד.\n\n# 8. Visual DNA\n\n**היקף:** התצפית הישירה מוגבלת לצילומי מנות ולאיור אתר. דיווח על סביבת ההפקה מגיע מכתבת עיצוב. אין כאן ניתוח שיטתי של הפיד.\n\n| רכיב | מה נצפה | פרשנות אפשרית | ביטחון |\n|---|---|---|---|\n| צילום מנה בסיר | צילום כמעט מלמעלה, סיר כהה מלא על משטח בהיר | הכמות והמרקם משמשים ראיה לארוחה משותפת | גבוה לתמונה |\n| צילום מאפה | מגש מחולק ליחידות, מבט עילי, שולחן בהיר | צורה חוזרת שמקלה לדמיין חלוקה לאורחים | גבוה לתמונה |\n| צבעוניות המזון | חומים וזהובים, ניגוד לרקע הבהיר | דגש על צלייה ומרקם | גבוה במדגם, נמוך להכללה |\n| איור הדמות | הבעה מוגזמת, כובע טבח, טלפון, להבה וירקות בתנועה | חיבור בין בישול, ביצוע קומי ויצירה דיגיטלית | גבוה |\n| רמת עיבוד | צילום אוכל ריאליסטי מול דמות מאוירת ותיאטרלית | שתי שפות שממלאות תפקידים שונים | בינוני |\n| תפאורה | כתבת העיצוב מתארת התאמת חומרים ותאורה לצילום | בית המשמש גם סביבת עבודה | דיווח, בינוני |\n\n**לוגיקה חזותית אפשרית:** שפע בתוך מסגרת מסודרת. פרטי האוכל רבים, אבל המסגרת פשוטה מספיק כדי שהמנה תישאר מובנת. זהו כיוון לבדיקה, לא פלטת מותג רשמית.\n\n**אין לקבוע מהמדגם:** סוג עדשה, טמפרטורת תאורה, שימוש בפילטר מסוים, פונטים קבועים, שכיחות כתוביות, Jump cuts, תנועות ידיים או לבוש חוזר. גם איור בכובע טבח אינו ראיה לכך שזהו הלבוש הקבוע בסרטונים.\n\n# 9. Vibe\n\n**במשפט אחד, הסקה מחקרית:** מדריך מטבח נגיש שהופך ידע, תיאבון ומשחק לשוני להזמנה להשתתף.\n\nבמפגש עם החומר שנבדק נוצרת תחושה של מטבח פעיל: יש בו משימה, מנה שאמורה להספיק לאנשים, וקול שמקצר את המרחק בין מי שיודע למי שעוד מנסה. האנרגיה אינה חייבת לבוא ממורכבות חזותית; היא יכולה להיווצר משם הסדרה, ממילה חוזרת או מהבטחה למרקם. זיכרון משפחתי מעניק לתוכן עומק, בעוד שילובים חדשים מונעים ממנו להישאר רק בארכיון של העבר. בו בזמן, האתר והעבודה עם מותגים מבהירים שמדובר ביצירת תוכן מקצועית. ההסקה היא קרבה שמיוצרת באמצעות שימושיות ומשחק, לא רק באמצעות חשיפה אישית. הצופה מוזמן ליהנות גם לפני שהחליט לבשל. אם יבשל, המפגש הבא עם הדמות עשוי לקרות דווקא בתוך הוראות המתכון. התיאור הזה הוא סינתזה של המדגם; הוא אינו קביעה על האופן שבו כל עוקב חווה אותו.\n\n| ממד | הערכה איכותנית | הסתייגות |\n|---|---|---|\n| אנרגיה | גבוהה בשפה | אודיו לא נותח |\n| ליטוש | בינוני-גבוה בנכסים שנבדקו | לא כל תוכן בהכרח מופק כך |\n| כאוס | מחווה קומית אפשרית, לא בלגן שיטתי | האיור מוגזם, צילומי האוכל מסודרים |\n| זוהר ויוקרה | נלווים, לא מרכז הממצא | אין בסיס ל״מותג יוקרה״ |\n| נגישות והזדהות | הבטחה מרכזית | ההצלחה אצל הקהל דורשת בדיקה |\n| אינטימיות | ביתית ותפקודית | אינה מעידה על שיתוף ללא גבולות |\n| בלעדיות | אינה דגש ברור | אין מועדון סגור שנבדק |\n| מרדנות | משחק במסגרת | אין בסיס לארכיטיפ מרדני דומיננטי |\n| אופטימיות | מכוונת עשייה | לא אפיון מצב רוח אישי |\n| הומור | סימן זיהוי בולט | מנגנוני אודיו לא נמדדו |\n| נוסטלגיה | נוכחת במתכוני משפחה | אינה כל התוכן |\n| אורבניות | יש הקשר ירושלמי | אין סגנון עירוני בלעדי |\n| צעירות | נגיש גם למוצר לימודי לילדים | לא דמוגרפיית הקהל |\n| כנות | נושא לבדיקת אמון | אי אפשר למדוד ״אמיתיות״ מטקסט |\n| אפלה, מיניות, Camp, אירוניה | לא נמצא בסיס מספיק | אין להפוך חוסר מידע לציון אפס |\n\n**מטאפורות מחקריות בלבד:** מקום: מטבח מארח; שיר: פזמון שהנוכחים כבר יודעים להשלים; מגזין: אוכל שימושי עם קול אישי; מותג: בית ספר ביתי לבישול; סרט: קומדיה סביב הכנת ארוחה; שעה: לפני הגשת האוכל; אירוע: מפגש שבו כולם ניגשים לסיר. אלו אינן העדפותיו המוצהרות.\n\n# 10. הומור\n\n**מנגנון ראשון: צליל כמזהה.** מילים משחקיות מספקות הנאה גם בלי מידע קולינרי חדש. היפותזת האפקט: הן מייצרות רצף בין פוסטים שונים ומשמשות רמז לזיהוי.\n\n**מנגנון שני: אתגור רך.** שם סדרת העצלנים הופך קושי לסיטואציה חברתית שאפשר להגיב עליה. אין לקבוע שהטון נתפס תמיד כחביב: חלק מהתגובות העקיפות מערערות על מידת הקלות.\n\n**מנגנון שלישי: היפוך ציפייה.** בראיון על רביולי לפורים הסביר אדרי שההמלצה לא להכין נועדה לעורר הפרעה ומעורבות. זהו מקרה נקודתי מתועד של Hook מכוון, לא הוכחה שכל אמירה שלו היא טקטיקה.\n\n**מנגנון רביעי: הגזמה פרוצדורלית.** חזרה על פעולה או כמות יכולה להפוך הוראה לקטע קטן. המושא הוא לעיתים סיטואציית הבישול עצמה, ולא אדם שאפשר ללעוג לו.\n\nלא אומתו בדיחות פנימיות נוספות, ממים שהקהל יצר, לעג עצמי עקבי או תזמון של מבט למצלמה. בראיון כדאי לבקש ממנו להראות היכן בדיוק הוא מכניס את הבדיחה, ומה הוא מסיר כדי שהמתכון יישאר ברור.\n\n# 11. אישיות ציבורית\n\n## Persona A: המדריך שמרשה ליהנות\n\n**הסקה מחקרית, ביטחון בינוני.** זו פרסונה מקצועית, לא תיאור מלא של האדם הפרטי.\n\n| רכיב | ניסוח עבודה | מעמד |\n|---|---|---|\n| תפקיד חברתי | מנגיש ידע קולינרי דרך תוכן נגיש | נתמך במדגם |\n| תפקיד רגשי | נותן רשות לנסות בלי טקסיות | השערה |\n| מטרה ציבורית | לעודד אנשים לבשל | הצגה עצמית |\n| התנהגות | מפרסם מתכונים, סדרות ותוכן שותפים | תצפית |\n| מוטיבציה | סיפוק מיצירה ומהאכלת אחרים | דיווחים עצמיים, לא מניע בלעדי |\n| צורך מקצועי | להישאר מזוהה ושימושי לאורך זמן | השערה |\n| תפיסה רצויה | איש אוכל שאפשר ללמוד ממנו ולהרגיש איתו בנוח | הסקה |\n| תסכול אפשרי | כשקלות הנתפסת מול מצלמה אינה עוברת למשתמש | כיוון לראיון, לא אמירה שלו |\n\n**ארכיטיפים אפשריים:** Creator בזכות העיבוד וההמצאה; Everyman בזכות הנגישות; Jester כמנגנון הגשה; Caregiver כאשר האוכל מוצג כדאגה לבית. אין הצדקה לבחור אחד מהם כזהות בלעדית. **Shadow אפשרי לבדיקה:** מותג שנדרש לשחזר שוב ושוב את אותו סימן זיהוי, גם כאשר היוצר רוצה להשתנות. אין ראיה שאדרי חווה זאת בפועל.\n\n# 12. Narrative Identity\n\nהסיפור הציבורי נע בין שלושה מוקדים: **ידע שנלמד במטבח**, **ניסיון שנצבר בעבודה**, ו**מפגש עם קהל דרך פלטפורמות**. המסעדנות נותנת רקע מקצועי; שמות מתכונים משפחתיים מספקים זיכרון; המדיה מאפשרת להפיץ אותם.\n\n**הסקה מחקרית:** סיפור ההצלחה אינו מחייב להציג ניתוק מהעבר. אפשר לקרוא אותו כהרחבה של אותה פעולה: להעביר אוכל וידע לאנשים רבים יותר. זו היפותזה על המבנה הנרטיבי, לא הסבר סיבתי להצלחה.\n\nה״ניצחון״ הציבורי עשוי להיות הצלחת אדם אחר לבשל, מעבר לפרסום עצמו. כדי לאמת זאת, כדאי לבקש דוגמה שהוא זוכר ומקרה שבו מדדי הפלטפורמה אמרו דבר אחר. אין בסיס להגדיר ״פצע״, טראומה, חרדה או קונפליקט נפשי.\n\n# 13. Values\n\n| ערך | מה תומך בו | מה עדיין פתוח |\n|---|---|---|\n| מסוגלות | הצהרה על הפחתת פחד מבישול | האם המשתמש מצליח בפועל |\n| המשכיות משפחתית | מתכוני ילדות ומתכון סבא | מה נשמר ומה משתנה במכוון |\n| שימושיות | הוראות, קטגוריות ומסלולי חיפוש | איכות איתור המתכון ושימוש בו |\n| יצירתיות | שינוי צורה והקשר של מנה | הקריטריונים שלו לרעיון טוב |\n| הנאה משותפת | מנות הגשה גדולות ומוצר הדרכה משפחתי | איזה קהל אכן משתמש כך |\n| שקיפות מסחרית נקודתית | סימון שיתוף פעולה בדוגמאות | אין בדיקה של כלל הפרסומים |\n\n**רמת ביטחון:** גבוהה לקיום הראיות; בינונית לקריאתן כמערכת ערכים. אין להשליך מהן על אמונה דתית, עמדה פוליטית או התנהלות פרטית.\n\n# 14. Tensions\n\nמתח מחקרי אינו טענה לצביעות. הוא נקודת מפגש בין דרישות שונות.\n\n| מתח | בסיס נצפה | למה הוא מעניין לראיון |\n|---|---|---|\n| קלות מול מאמץ | סדרה נגישה לצד פעולות מרובות וזמני בישול ארוכים | האם ״קל״ פירושו מעט פעולות, מעט טעויות או מעט פחד? |\n| מסורת מול שינוי | מתכון משפחתי בגרסה מותאמת | היכן נמצא הגרעין שאסור לשנות? |\n| היכרות מול חידוש | סדרה ומשפטים חוזרים לצד מנות חדשות | מה חייב להישאר כדי שהקהל יזהה אותו? |\n| בידור מול הוראה | שפה קומית בתוך רצף ביצוע | מתי הבדיחה מפריעה להבנה? |\n| שירות לקהל מול שירות למותג | מרכיבים ממותגים בתוך מתכון שימושי | מי קובע מה תיכנס למנה? |\n| בית מול סביבת הפקה | חלל מגורים שמותאם לצילום | איך שומרים על הפרדה תפעולית? |\n| קול אישי מול ממשק אוטומטי | שפת הדמות בעמוד AI | מי אחראי כאשר הממשק נשמע כמוהו? |\n\n**Self-presentation מול תוצר:** הצעה של נגישות מתקיימת לצד מקצוענות ותכנון. אין סתירה הכרחית: לעיתים עבודה רבה של היוצר היא שמייצרת פשטות לצופה. ההשערה הזאת צריכה להיבדק בתהליך עבודה ממשי.\n\n# 15. הקהל\n\n## מה ידוע ומה אינו ידוע\n\nאין נתוני Analytics, ראיונות עוקבים או נתוני רכישה. אי אפשר לקבוע ״העוקבת הטיפוסית״, גיל ממוצע, מצב משפחתי, מקום מגורים או הכנסה. שמות משתמשים וצורת כתיבה אינם בסיס לפילוח דמוגרפי.\n\n**רישום ראיות הקהל המצומצם:** בעמוד התצוגה של פרק 29 נמצאו בקשות להחלפת רכיבים, דיווח הצלחה על מתכון אחר, חיבה והסתייגויות מהמאמץ. בעמוד הסלט נמצאו כוונת הכנה, העדפות טעם וציפייה למשפט מזוהה. אין אימות לזהות המגיבים, ואין לדעת כיצד האתר בחר את התגובות. השימוש כאן הוא ביצירת השערות בלבד.\n\n## סגמנטים לפי צורך, לא לפי זהות\n\n| סגמנט משוער | מה הוא מחפש | מה עשוי למשוך | טריגר לפעולה | סיכון אפשרי | ביטחון |\n|---|---|---|---|---|---|\n| המבשל הפרקטי | פתרון לארוחה | תוצאה ברורה והוראות ישימות | צורך עכשווי במנה | חוסר התאמה לזמן ולציוד | בינוני |\n| המבשל המתפתח | ללמוד טכניקה בלי להירתע | פירוק פעולה ומסר מעודד | הצלחה קטנה שמצדיקה ניסיון נוסף | פער בין הדגמה לביצוע | נמוך-בינוני |\n| הצופה לשם הנאה | תוכן אוכל עם אישיות | זיהוי, קצב והפתעה | רצון להעביר קטע למישהו | שחיקה של פורמט | נמוך-בינוני |\n| המארח | מנה להגשה משותפת | מראה, כמות וחגיגיות | חג או מפגש | מתכון שאינו סובל הכנה מראש | נמוך-בינוני |\n| לומדים במסגרת משפחתית | פעילות והדרכה | מוצר לימודי המיועד לכך | החלטה ללמוד יחד | התאמה לרמת המיומנות | גבוה לקיום ההצעה, לא לגודל הקהל |\n| מותגים ואנשי תוכן | יוצר עם יכולת להדגים מוצר | שילוב שימושיות וזיהוי | התאמה לקמפיין | מוצר שאינו תורם למשימה | בינוני |\n\nאין תשתית לקבוע שיעור נאמנות, נטישה, מעריצים כבדים או Hate-followers. השפה ואופי השיתוף בכל קבוצה דורשים מחקר ישיר. הבסיס לפילוח:.\n\n## Persona B: ״רוצה להכין, צריכה להבין״\n\n**Proto-persona, ללא גיל או מגדר מאומתים.** לשון הנקבה משמשת לקריאות בלבד.\n\n- **מצב שימוש:** עליה לבחור ולהכין ארוחה במסגרת זמן ומשאבים נתונים.\n- **מטרה פונקציונלית:** לדעת מראש מה צריך, מה אפשר להחליף ואיפה אפשר לטעות.\n- **מוטיבציה משוערת:** לקבל תוצאה טובה בלי לקרוא כמה מתכונים סותרים.\n- **צורך רגשי:** ביטחון להתחיל, במיוחד כאשר הפעולה אינה מוכרת.\n- **תסכול אפשרי:** הבטחה שנשמעת פשוטה אך מסתירה הכנות, כלי נוסף או זמן המתנה.\n- **התנהגות לבדיקה:** שמירה, חזרה לטקסט בזמן בישול ושאלות התאמה. אין נתון על שכיחותן.\n- **Relatable:** דיבור על ארוחה אמיתית ועל מגבלות ביצוע.\n- **Aspirational:** יכולת לאלתר ולהבין מה קורה בסיר, מעבר להעתקת הוראות.\n- **מה יש לאמת:** האם היא עוקבת בקביעות, או מגיעה רק מחיפוש מתכון ספציפי?\n\n## Persona C1: ״נהנה מהמטבח גם מהספה״\n\n**השערה לבדיקה.** צופה שהערך העיקרי עבורו הוא החוויה ולא הביצוע. הצלחה עבורו עשויה להיות קטע מהנה, תחושת היכרות או רעיון לשיחה. אין הצדקה להגדיר אותו כעוקב פחות חשוב: ייתכן שהוא מפיץ תוכן ומעמיק זיהוי גם בלי לבשל. שאלת המחקר היא מה מחזיר אותו: הדמות, האוכל, הציפייה לבדיחה או שילוב ביניהם. אין כאן אומדן גודל.\n\n## Persona C2: ״רוצה לארח בלי ללכת לאיבוד״\n\n**השערה הנגזרת מהיצע התוכן.** המשתמש מחפש תוצאה שנראית חגיגית אבל זקוק גם לתכנון: כמויות, הכנה מראש, חלוקה והגשה. עניינו בדמות עשוי להיות משני לאמון בתוצאה. בהמשך יש לבחון אם מנה שצולמה כמרשימה אכן עוזרת לארגן אירוח, או רק מעוררת השראה. הנוכחות של מנות חג אינה מוכיחה שזהו קהל נפרד בפועל.\n\n# 16. JTBD\n\nהמשפטים הבאים הם ניסוחי מחקר, לא ציטוטי עוקבים. יש לבדוק אותם מול חוויות קונקרטיות.\n\n| סוג Job | ניסוח | אינדיקציה | מה יאמת אותו |\n|---|---|---|---|\n| Functional: החלטה | כשאין לי רעיון לארוחה, אני מחפש אצל אדרי אפשרות שאוכל להתאים למה שיש לי | מגוון וממשקי איתור | צפייה בתהליך בחירת מתכון |\n| Functional: ביצוע | כשאני לא בטוח בטכניקה, אני נעזר בהדגמה ובהוראות כדי להתקדם | אופי ההוראות | בישול בפועל וזיהוי נקודות עצירה |\n| Emotional: מסוגלות | כשבישול מרגיש גדול עליי, אני רוצה מדריך שיעזור לי להתחיל | הצעת הערך המוצהרת | תיאור לפני ואחרי ניסיון ממשי |\n| Emotional: נוחות | כשאני רוצה רגע מוכר ונעים, אני פונה לתוכן אוכל עם קול שאני מזהה | היפותזה מהשפה ומהתוכן | יומן שימוש וראיון עוקבים |\n| Social: אירוח | כשאני מארח, אני רוצה להגיש משהו שאוכל להיות גאה בו | מנות חג והגשה | סיפור אירוח אחד, כולל מה השתבש |\n| Social: השתתפות | כשמישהו סביבי מכיר את הדמות, סימן הזיהוי מאפשר לנו לחלוק הקשר | רמז מוגבל בתגובות | דוגמאות טבעיות מחוץ לפוסט |\n\n**אין להסיק אוטומטית:** צורך ברכילות, FOMO, בדידות או קשר פאראסוציאלי עמוק. ממצאים כאלה מחייבים עדות ישירה ולא רק צריכת תוכן קבועה.\n\n# 17. Empathy Map\n\n| ממד | מפת עבודה | מעמד הידע |\n|---|---|---|\n| Says | ״אפשר להחליף באורז?״; ״מכינה היום!״ | דוגמאות קצרות מתצוגות צד שלישי |\n| Thinks | האם יש לי את החומרים, הזמן והיכולת? | השערה, לא קריאת מחשבות |\n| Does | התאמות, תכנון ניסיון או דיווח על הכנה מופיעים בתגובות | התנהגות מדווחת; הביצוע עצמו לא נצפה |\n| Feels | ייתכנו סקרנות, תיאבון וביטחון, ולעיתים תסכול | אין מדידה רגשית |\n| Pains | חוסר בהירות לגבי מאמץ, תחליפים וציוד | צורך מוצע לבדיקה |\n| Gains | ארוחה, ידע, תחושת הצלחה או הנאה מהתוכן | השערות ערך נפרדות |\n\n**השלכה ל-UXR:** השאלה ״אהבת את הסרטון?״ אינה מספיקה. צריך לשאול מה המשתמש ניסה לעשות אחריו, איפה חיפש מידע, ומה קרה כשהתרחק מהמסך.\n\n# 18. מערכת היחסים עם הקהילה\n\n**הסקה מחקרית:** הקשר המוצע הוא של הדרכה מוכרת ומתמשכת. שם סדרה, הוראות והפניות לביצוע מאפשרים למשתמש לחזור עם משימה, ולא רק עם סקרנות לגבי חיי היוצר.\n\nקיימת דוגמה ישירה ללולאת משוב בתיאור פרק 38: אדרי מספר שמתכון הגיע לפרסום בעקבות עניין שעלה לאחר Story. זהו דיווח שלו על תגובת הקהל; לא נבדקו ההודעות המקוריות.\n\n| ממד קשר | הערכה | מגבלה |\n|---|---|---|\n| Authority | נבנית מהדגמה ומידע שימושי | לא בוצעו מבחני מתכונים |\n| Intimacy | אפשרית דרך קול מוכר וסביבת בית | היכרות נתפסת אינה קשר אישי הדדי |\n| Reciprocity | יש אינדיקציה לתוכן שמגיב לבקשה | אין שיעור תגובה או זמני מענה |\n| Belonging | סימני זיהוי עשויים ליצור שפה משותפת | לא אומת שם רשמי לקהילה |\n| Exclusivity | לא נמצא דגש מבוסס | אין עדות למדיניות מועדון |\n\nלא נצפו מספיק תשובות ישירות שלו למגיבים כדי לנתח כיצד הוא מתקן טעות, מתמודד עם התנגדות או מנהל עימות. זהו פער חשוב לפני כתיבת שאלות מניחות על ״הקשר המיוחד שלך עם העוקבים״.\n\n# 19. Cultural Context\n\n**הקשר תרבותי מתועד:** מאכלים מרוקאיים וירושלמיים, אוכל משפחתי, חגים ומפגש עם צורות וטעמים ממטבחים אחרים. זוהי מפה קולינרית, לא הסקה של זהות דתית או מוצא מעבר לדברים שהוצהרו בפומבי.\n\n**הסקה:** המזון משמש חומר תרבותי מוכר שאפשר לעבד. אוזן המן, למשל, יכולה לשמש צורה גם במנה שאינה העוגייה המקובלת. השינוי עובד משום שיש לצופה נקודת מוצא לזהות.\n\n**אקטואליה:** פרק המתייחס לימי אזעקות ממסגר ארוחה כמענה לחוסר זמן ופניות. זהו שימוש בהקשר ישראלי יומיומי; אין להסיק ממנו עמדה פוליטית, מצב רגשי אישי או עמדה של כלל הקהל.\n\n**נוף רגשי אפשרי:** הנאה בתוצאה, גאווה בביצוע, געגוע במתכוני משפחה, נחמה באוכל חם וסקרנות בפתרון חדש. אלה תפקידי תוכן אפשריים. תגובת הקהל לכל רגש לא נמדדה, ולא נמצא בסיס לתאר חרדה, קנאה או כעס כצירים מרכזיים בדמות.\n\n# 20. Influences\n\n| סוג | מה נמצא | איך להשתמש במחקר |\n|---|---|---|\n| השפעה מוצהרת | הסב והמטבח המשפחתי מוצגים כמקור ללמידה וליצירתיות | לבקש דוגמה לטכניקה או החלטה שנשארה |\n| אנשים שהוא העריך בראיון | יובל בן נריה; אפרת ליכטנשטט, רחלי קרוט, רובי מיכאל, בן שי ויעל דבי | הערכה אינה הוכחה להשפעה ישירה |\n| מסגרת מקצועית | ניסיון במסעדנות | לברר מה ממנה עבר להדרכה ברשת |\n| השפעה נראית | חיבור בין מתכון קצר, טקס לשוני והדגמה | דמיון פורמטי, לא שיוך ליוצר מסוים |\n| השראה בין-תרבותית | עיבוד מנות וצורות ממטבחים שונים | לברר מקור, קרדיט וגבולות שינוי |\n\nלא נמצא בסיס אמין להשפעה מוגדרת של מוזיקאי, סרט, מעצב, מגזין או תת-תרבות. אין להמציא רשימת השראות כדי להשלים את הפרופיל.\n\n# 21. Reference Universe\n\n| אזור במפה | עוגנים ציבוריים | סוג הקשר |\n|---|---|---|\n| מקור ידע | סבא יעקב והמטבח המשפחתי | נרטיב ולמידה |\n| קולגות | איתי אדרי; יוצרים שהוזכרו בהערכה | קרבה משפחתית ציבורית או הערכה מקצועית, לא בהכרח שיתוף פעולה |\n| מפגש מקצועי | אפרת ליכטנשטט | כתבה המתארת בישו אן כקמפיין מאומת. זהו כיוון לבדיקה של התרחבות מעבר לאוכל, לא ממצא מסחרי סגור.\n\n# 23. Authenticity Signals\n\nהמחקר אינו מדרג את אדרי כ״אמיתי״ או ״מזויף״. הוא בודק אילו אותות יכולים לתמוך בתחושת אמינות.\n\n| אות | מה המשתמש עשוי לקרוא בו | הסבר חלופי או מגבלה |\n|---|---|---|\n| פירוט פעולות | יש כאן ידע שניתן להשתמש בו | פירוט אינו מבטיח הצלחה |\n| זיקה למתכון משפחתי | המשכיות וניסיון אישי | זה גם אמצעי נרטיבי |\n| קרדיט לבת זוג במתכון | היוצר אינו מציג כל רעיון כשלו | דוגמה נקודתית בלבד |\n| גילוי שיתוף | ההקשר המסחרי אינו מוסתר בעמודים שנבדקו | אין בדיקת גילוי בכל הפלטפורמות |\n| קול עקבי בכמה נקודות מגע | היכרות ורציפות | עקביות יכולה להיות מתוכננת היטב |\n| התאמת סביבת צילום | השקעה בהצגה ברורה | אין להסיק ספונטניות מהופעת בית |\n\n**השערה:** אמון עשוי להישען יותר על חוויית הצלחה מצטברת מאשר על מראה ״לא ערוך״. כדי לבדוק, צריך לשאול עוקב מה שינה את דעתו לאחר שבישל, לא רק לאחר שצפה.\n\n# 24. Boundaries\n\n**משותף בפומבי במדגם:** אוכל, תהליך מקצועי, חלק מסיפור הקריירה, זיכרונות קולינריים והיבטים של הבית והמשפחה.\n\n**הבחנה חיונית:** תוכן ביתי אינו היתר לשאלות על כל מי שחי בבית. הראיון מ-2026 מצביע על הבדלים ברצון בני המשפחה להיחשף. אין צורך לפרט את הילדים או לשאול עליהם כדי להבין את מנגנון התוכן.\n\nנושאים שאין להם בסיס מספיק במחקר: בריאות, דת, השקפה פוליטית, פרטים אינטימיים ונתונים פיננסיים פרטיים. היעדרם במדגם אינו מוכיח שאדרי מעולם לא דיבר עליהם, או שמדובר בטאבו.\n\n**לראיון:** אפשר לשאול איך מתקבלת החלטה על שיתוף של אדם נוסף, כיצד מפרידים צילום משגרה, ומה הוא מעדיף שישאלו רק לאחר תיאום. לא נכללו כתובת, פרטי קשר פרטיים או מידע על מסגרות של ילדים.\n\n# 25. Trigger Map\n\n| טריגר אפשרי | כיוון תגובה | בסיס | איך לבדוק בלי להניח |\n|---|---|---|---|\n| תוצאה שנראית טעימה | עניין ורצון לנסות | תמונות ותגובות עקיפות | מה עורר פעולה בפעם האחרונה? |\n| פתרון שאפשר להתאים | שאלה או מעורבות | בקשות התאמה במדגם | איזו התאמה הייתה קריטית? |\n| סימן זיהוי מוכר | חיבה וציפייה | מדגם תגובות מוגבל | מה מורגש כשאינו מופיע? |\n| פער בין הבטחת קלות לעבודה | הומור ביקורתי או תסכול | פרק 29 בתצוגה משנית | מה נחשב למאמץ אצל הצופה? |\n| רכיב שאינו מתאים לטעם | התאמה או ויתור | מדגם הסלט | האם המשתמש שינה או נטש? |\n| עודף מסחריות | לא נקבע | אין קורפוס תגובות מספיק | שאלה למחקר, לא מסקנה |\n| חשיפה אישית או פוליטיקה | לא נקבע | אין בסיס מספק | לא להמציא סיכון בשם הקהל |\n\n**Sentiment map איכותנית בלבד:** נצפו ביטויי חיבה, שימושיות וביקורת נקודתית. אין אחוז חיובי, ״סערה״, מגמת נטישה או הוכחה להתנגדות מאורגנת.\n\n# 26. Content Mechanics\n\nהפירוק להלן מבוסס על טקסטים, מבנה ארכיון ודוגמה שבה אדרי הסביר Hook. הוא אינו תחליף לניתוח פריים אחר פריים.\n\n| שלב | מנגנון שניתן לזהות | תפקיד אפשרי | גבול הראיה |\n|---|---|---|---|\n| Hook | מנה מוכרת, בעיה שימושית או היפוך ציפייה | לתת סיבה לעצור | אין נתוני עצירה |\n| Setup | הבטחת תוצאה והצגת הקשר | להסביר מה הולכים לקבל | בעיקר בטקסט |\n| Tension | איך הפעולות יתחברו למנה | ליצור סקרנות מעשית | השערה ללא נתוני צפייה |\n| Demonstration | פעולות וחומרי גלם | להפוך ההבטחה לנתיב ביצוע | ההוראות נקראו, הבישול לא נוסה |\n| Payoff | תוצאה, מרקם ואפשרות הגשה | לתגמל סקרנות ולהניע ניסיון | נתמך בצילומי המנות |\n| CTA | מעבר למתכון, חיפוש או הכנה | להביא פעולה מעבר לצפייה | האתר מאפשר זאת |\n| Loop | לא אומת לופ וידאו | אין לקבוע | נדרשת צפייה |\n\n## שלושה מקרי מבחן\n\n**א. פרק 38:** מצב חיים מגביל → ארוחה מותאמת → הוראות. הכוח האפשרי הוא ברלוונטיות של הסיטואציה, לא רק ביופי המנה.\n\n**ב. בורקס שמרית:** מוצר מקבל תפקיד בפתרון תהליכי. יש גם פירוט המסביר בחירה בטכניקה, ולא רק הצגת אריזה. כדי להעריך איכות מסחרית צריך לבדוק אם הטיפ נשאר שימושי למי שמחליף מותג.\n\n**ג. חצ׳פורים:** חיבור בין חג לצורת מאפה ולטעמים. ההפתעה נוצרת מצירוף מוכר-חדש, ולא בהכרח מחומר גלם נדיר.\n\n**Retention devices אפשריים:** סדרה ממוספרת, ציפייה לתוצאה, הפתעה צורנית ושפה מזוהה. לא אומתו ספירת קאטים, קצב כתוביות, בחירת מוזיקה, לולאה או זמן ממוצע עד נטישה.\n\n**הבחנה בין פלטפורמות לפי דבריו:** בראיון מ-2026 הוא מבחין בין אנרגיה פרועה יותר בטיקטוק לבין דגש על מראה ותוצאה קולינרית באינסטגרם. זו תפיסתו המוצהרת, ולא מסקנה מצפייה השוואתית שבוצעה במחקר.\n\n# 27. Signature Elements\n\n**הסקה מחקרית:** אם מסירים את כל הרכיבים הבאים יחד, התוכן עלול להישאר מתכון תקין אך לאבד חלק מזיהויו עם אדרי:\n\n1. שכבת קול אישית שאפשר לזהות גם ללא שם היוצר.\n2. הפיכת מטלת בישול למפגש פחות טקסי.\n3. שילוב בין מקצוענות מעשית להנאה.\n4. תוצאה שאפשר לדמיין במטבח או על שולחן משותף.\n5. קשר בין מנה מוכרת לבין פתרון או עיבוד חדש.\n6. נכס תוכן שחוזרים אליו, מעבר לצפייה הראשונה.\n\nלא כל פוסט חייב להכיל את כל השישה. יש להבחין בין **סימן זיהוי הכרחי למותג** לבין **הרגל יצירתי שאפשר להחליף**. זו אחת ההבחנות שכדאי לבדוק עם אדרי עצמו ועם עוקבים.\n\n# 28. Anti-DNA\n\nזו מפת התאמה למדגם, לא רשימת איסורים או תחזית למה אדרי יסכים לעשות.\n\n| כיוון | התאמה משוערת | הסיבה |\n|---|---|---|\n| הוראות אקדמיות ללא קול אישי | נמוכה | מאבדות את המפגש בין ידע למשחק |\n| לעג למי שלא הצליח | נמוכה | עלול להתנגש בהבטחת המסוגלות |\n| אסתטיקה שמסתירה את שלבי העבודה | נמוכה-בינונית | יופי לבדו אינו מסייע לבצע |\n| חומר מסחרי ללא שימוש מובן | נמוכה | קשה לחבר להבטחה הפרקטית |\n| קלישאות משפחתיות ללא דוגמה | נמוכה | הופכות זיכרון לתיאור גנרי |\n| מתכון מורכב | אפשרית | מורכבות כשלעצמה אינה מנוגדת לדמות |\n| תוכן רציני ושקט | אפשרית | אין בסיס לדרוש בדיחה בכל מצב |\n| תחום חדש מחוץ לאוכל | לא ידועה | יש לבדוק איזה חלק מהערך ניתן להעברה |\n\nאין די ראיות כדי לקבוע מילים שלעולם לא ישתמש בהן או מותגים שלעולם לא יעבוד איתם.\n\n# 29. Reputation\n\n| נקודת מבט | מה אפשר לומר | מה אין לומר |\n|---|---|---|\n| Self image | מתכונאי עם קול אישי והצעת נגישות | שזו כל הזהות הפרטית שלו |\n| Media image | כתבות מזהות הומור והנגשה כמאפיינים מרכזיים | שהוא מוביל את כולם בכל מדד |\n| Fan image | מדגם עקיף מציג חיבה, שימוש וציפיות | שכל הקהל מרוצה או נאמן |\n| Critic image | נמצאה ביקורת נקודתית על תוכן | שקיים מוניטין שלילי רחב |\n| Industry image | נוכחות בתוכן מותגים ובהדרכה | נתוני אפקטיביות מסחרית שלא נמדדו |\n\n**הקשר השוואתי:** בכתבת הענף מוצגים יוצרים רבים כבעלי תוכן נגיש. לכן ״נגישות״ לבדה אינה בידול מספיק. הציר שעשוי לבדל את אדרי הוא החיבור בין הוראה לסימני שפה. זו השערה למיצוב, לא השוואה שיטתית מול פידים מתחרים.\n\nנמצאה התייחסות עצמית למחלוקת תשלום בראיון. לא נבדק תיק משפטי ואין כאן קביעה על אחריות או תוצאת הליך. היא אינה בסיס לשיפוט מוניטין; אם תעלה בראיון, נכון להתמקד במדיניות עבודה וגבולות מקצועיים.\n\n# 30. Trust Architecture\n\n**מודל מוצע לבדיקה:**\n\n| שכבת אמון | השאלה שהקהל עשוי לשאול | מה יכול לבסס אותה | מה עלול לשחוק אותה |\n|---|---|---|---|\n| מקצועית | האם המתכון יעבוד אצלי? | הוראות והצלחות חוזרות | מידע חסר או תוצאה לא עקבית |\n| תפקודית | האם אוכל למצוא ולהשתמש בו? | ארגון, חיפוש וטקסט קריא | חיפוש כושל או מעבר מסורבל בין מסכים |\n| אישית | האם אני מבין מי מדבר אליי? | קול עקבי וגבולות מובנים | שינוי בלתי מוסבר בהבטחה |\n| מסחרית | האם יש ערך מעבר למוצר? | תפקיד ברור וגילוי שיתוף | תחושת תלות מיותרת במותג |\n| תרבותית | האם הדבר מוכר ומשמעותי עבורי? | הקשר, קרדיט וטעם מוכר | הכללות או מקור לא ברור |\n\nההצלחה החשובה אינה בהכרח שהצופה מאמין לכל אמירה. אמון שימושי מאפשר גם לשאול, להחליף רכיב ולהצביע על מה שלא עבד. אין במחקר נתון המאשר כיצד אדרי מטפל בכל מצב כזה.\n\n# 31. Positioning\n\n**מי:** מתכונאי ויוצר תוכן עם שפה ציבורית מזוהה. \n**עבור מי:** אנשים שמחפשים רעיון, ביטחון או הנאה סביב אוכל, ללא פילוח דמוגרפי מוכח. \n**עולם תוכן:** המטבח הביתי, על פני שימוש יומיומי, אירוח וחידוש. \n**הבטחה נתפסת:** אפשר לגשת לבישול עם ידע, סקרנות ופחות ריחוק. \n**סיבת זיכרון אפשרית:** חיבור בין משימה למערכת זיהוי מילולית. \n**ייחוד:** מידת הבידול מול אחרים עדיין דורשת מחקר השוואתי.\n\n> **Positioning hypothesis:** קובי אדרי מתרגם בישול ביתי לחוויה נגישה ומזוהה, שבה ההנאה מהדרך מסייעת להזמין את הצופה לנסות בעצמו.\n\n## חמש תמציות מחקריות\n\n1. מדריך בישול שקולו הוא חלק מהכלי שהוא נותן לקהל.\n2. מתכונאי שמחבר זיכרון ביתי לפורמט דיגיטלי שימושי.\n3. יוצר שההומור שלו יכול להקטין את המרחק מהמשימה.\n4. איש אוכל הבונה זיהוי גם באמצעות מילים, לא רק מנות.\n5. מארח ציבורי שהזמנה להשתתף עומדת במרכז ההצעה שלו.\n\nכל החמש הן הסקות, לא סלוגנים רשמיים או טענות בלעדיות.\n\n# 32. Creator DNA Canvas\n\n| ממד | DNA מוצע | רמת ביטחון |\n|---|---|---|\n| Core identity | מתכונאי ויוצר עם קול משחקי | גבוהה |\n| Audience promise | כניסה נגישה לעולם הבישול | בינונית-גבוהה |\n| Voice | מדוברת, ישירה, קצבית בטקסט | גבוהה במדגם |\n| Humor | צליל, חזרה, אתגור והפתעה | בינונית |\n| Visual style | אוכל מוחשי ושפע לצד דמות מותג מוגזמת | בינונית, מדגם קטן |\n| Emotional tone | מסוגלות, הנאה והיכרות | השערה בינונית |\n| Content pillars | בית, זיכרון, פתרונות, אירוח והדרכה | גבוהה |\n| Cultural references | חגים, מאכלים מקומיים ועיבודים בין מטבחים | גבוהה |\n| Community dynamic | חזרה למדריך ולשפה מוכרת | בינונית-נמוכה |\n| Commercial fit | מוצר המבצע תפקיד במתכון | בינונית |\n| Main tension | הבטחת קלות מול עבודת הביצוע | בינונית |\n| Signature behavior | חיבור הוראה לסימן זיהוי | בינונית-גבוהה |\n| Differentiator | מערכת שפה סביב ידע שימושי | היפותזה בינונית |\n| Anti-DNA | ריחוק או מסחריות שאינם תורמים למשימה | השערה |\n\n# 33. 10 תובנות מפתח\n\n1. נגישות היא הבטחת תוכן; הצלחה בפועל היא שאלת מחקר אחרת.\n2. שפה מזוהה יכולה לשמש כלי ניווט וזיכרון, ולא רק בידור.\n3. מתכון ממושך עדיין יכול להיות נתפס כקל, אם הוא מפחית החלטות.\n4. צופה שאינו מבשל עשוי לקבל ערך אחר, ואין למחוק אותו מהמחקר.\n5. זיכרון משפחתי הופך משמעותי כאשר הוא קשור לבחירת מנה או טכניקה.\n6. מסחריות יכולה להשתלב במשימה, אבל התאמתה דורשת בדיקה אצל המשתמש.\n7. צילום תוצאה יפה אינו מוכיח שהוראות הביצוע מספיקות.\n8. האתר מרחיב את המותג ממפגש חד-פעמי לשימוש חוזר.\n9. ממשק AI מוסיף שאלת אחריות חדשה לקול המזוהה עם אדם.\n10. הראיון הבא צריך לבדוק החלטות ומקרים, ולא לבקש ממנו לחזור על הביוגרפיה.\n\nאלה תובנות סינתזה מהדוח. ביטחונן גבוה כאשר הן מתארות נכס שנמצא, ובינוני או נמוך כאשר הן מסבירות את חוויית הקהל.\n\n# 34. 10 דברים שקל לפספס\n\n1. מספר פרק הוא רמז להמשכיות, אך לא הוכחה להרגל צפייה.\n2. שם מנה עשוי לתפקד גם ככותרת תרבותית וגם כהוראת ציפייה.\n3. הטון המדובר מופיע גם בתוך הוראות כתובות, לא רק בתיאור המותג.\n4. המסחריות אינה תמיד שכבה שמתווספת בסוף; לעיתים היא משפיעה על מבנה הפתרון.\n5. קטגוריות האתר מערבבות סוג מזון, סיטואציה וזהות שימושית. זו החלטת ארגון שכדאי לבדוק עם משתמשים.\n6. שדה חיפוש שנשמע כמו היוצר מעלה ציפייה לתשובה בעלת אותה סמכות.\n7. צילומי המנות שנבדקו מציגים אובייקט קבוצתי, סיר או מגש, יותר מאשר מנה אישית.\n8. איור תיאטרלי וצילום מזון ענייני יכולים להשתייך לאותו מותג בלי להיראות זהים.\n9. דירוג אפס בעמוד מתכון אינו בהכרח ביקורת שלילית: ייתכן שאין דירוגים או שהרכיב לא נטען. אין לפרש אותו כסנטימנט.\n10. המדגם כולל דפים עם תאריכי סריקה שונים; אסור להפוך סדר הופעה למסקנה על אבולוציה יצירתית.\n\n# 35. 10 שאלות מחקר פתוחות\n\nהשאלות מיועדות להמשך בירור, לא לשאלון סופי בסדר הגשה.\n\n1. **Identity:** איזה חלק בעבודה חשוב לך שיבינו גם מי שמכירים רק את ביטויי הזיהוי?\n2. **Career:** איזו החלטה מהעבודה במסעדות שינית כשעברת להדריך דרך מסך?\n3. **Values:** לפי מה אתה קובע שמתכון הצליח, מעבר לצפיות?\n4. **Audience:** מתי גילית שקהל משתמש בתוכן שלך בדרך שלא תכננת?\n5. **Creative process:** קח רעיון אחד מהחודש האחרון: מה השתנה מהטיוטה לפרסום, ולמה?\n6. **Humor:** איך אתה מבדיל בין חזרה שהקהל אוהב לבין חזרה שכבר לא עובדת?\n7. **Boundaries:** איך נקבע מה מהבית ומהמשפחה נכנס לתוכן?\n8. **Money / commercial work:** תאר בריף ששינית או דחית כי לא התאים לתוצאה שרצית לתת לצופה.\n9. **Culture:** במתכון שמגיע מהבית, מה מבחינתך חייב להישמר ומה פתוח לשינוי?\n10. **Future / contradictions:** מה תרצה לשנות בהמשך, ואיזה חלק מהזיהוי הקיים עלול להקשות על השינוי?\n\n**פערים שיש לאמת בנוסף:** תפקידו בפיתוח ובהפעלת ממשק ה-AI; מספר אנשי הצוות; חלוקת עבודת הכתיבה והעריכה; מהירות מענה; הגדרה מעשית של ״קל״; נתוני ביצוע מול צפייה; וההבדלים בין קהלי הפלטפורמות.\n\n# 36. Q&A Readiness Map\n\n| אזור | מה כבר מבוסס | זווית שכדאי לפתח | חומר שכדאי להביא | רגישות |\n|---|---|---|---|---|\n| 1. שאלות בטוחות | רקע מקצועי ותוכן קולינרי | מעבר מידע מקצועי להסבר קצר | מתכון מוקדם מול נוכחי | נמוכה |\n| 2. עומק | הבטחת נגישות ומגוון מורכבויות | מהי קלות עבורו ועבור מתחיל | מקרה שבו צופה התקשה | בינונית, בלי האשמה |\n| 3. מתחים | שילוב יצירה, זיהוי ומסחר | החלטה שבה דרישות התנגשו | גרסה שנגנזה או שונתה | לדבר על תהליך, לא להניח מניע |\n| 4. יצירה | שפה, סדרה ועיבוד מנה | מה נכתב, מה מאולתר ומה נערך | טיוטה, טקסט ופרסום סופי | נמוכה |\n| 5. קהילה | אינדיקציות לצורכי התאמה | איך הופכת תגובה להחלטה | תגובה ציבורית שהוא בוחר | להסיר פרטי מגיבים לא נחוצים |\n| 6. עתיד | אתר וממשק חיפוש מבוסס שיחה | אחריות, סגנון וגבול האוטומציה | דוגמת שאילתה ותשובה | לברר תפקוד לפני הנחת יכולת |\n| 7. גבולות | הופעת הבית לצד עבודה מקצועית | איך מחליטים מה נשאר מחוץ למסך | כלל עבודה שהוא רוצה לשתף | לכבד אי-רצון להרחיב |\n\n## הנחיות למראיין\n\n- לפתוח בדוגמה שהוא יכול להראות. פעולה ממשית חושפת החלטות טוב יותר משאלה כללית על ״אותנטיות״.\n- להבחין בין מה שהוא התכוון לעשות לבין מה שהקהל עשה.\n- לשאול על מקרה אחד לפני שמבקשים כלל.\n- לא להציג את פרסונות הקהל כממצא שעליו להסכים איתו.\n- לא לנסח שאלה כגון ״למה הפכת למסחרי מדי?״. המחקר לא הוכיח זאת.\n- לבקש דוגמה נגדית: מתכון טוב שלא הצליח במדיה, או קטע מצליח שלא הוביל לבישול.\n- להציג תגובות כקולות בודדים, לא כ״הקהל אומר״.\n\n## מתווה UXR להשלמת הפערים\n\n**הצעת מחקר עתידית, שלא בוצעה:** לגייס מגוון משתמשים לפי התנהגות, למשל מי שבישלו, מי ששמרו ולא בישלו, ומי שצופים להנאה. לבצע ראיונות קצרים סביב אירוע שימוש אחרון, ובדיקת בישול או איתור מתכון עם מספר משתתפים. אין צורך להתחיל בפילוח גילאי שרירותי.\n\nבדיקה איכותנית ראשונית יכולה לכלול 6-8 משתתפים ומגוון רמות ניסיון. המספר אינו מספק לייצוג סטטיסטי. המטרה היא לזהות נקודות עצירה, פירושי ״קל״, ערך נתפס ותפקיד השפה. יש להשוות בין הצלחת הצפייה, הצלחת איתור המידע והצלחת הביצוע: אלה שלושה דברים שונים.", "profile2": "## 1. סקירה כללית\n\nקובי אדרי הוא מתכונאי ויוצר תוכן קולינרי עם רקע במסעדנות ובזכיינות (בישראל ובארה״ב). **[עובדה]** בתקופת הקורונה פתח חשבון TikTok, ושם הייתה הפריצה. היום הוא מתחזק קהלים ב-TikTok, Instagram, YouTube ו-Facebook, ומדבר בפומבי גם על הצד התפעולי: לתחזק ערוצים, לענות לעוקבים ולטפל בתגובות. **[דיווח, Mako 2026]**\n\nהוא מזוהה עם **שפה**: ביטויים כמו \"קשה? לא קשה!\", חזרות (\"ערבב ערבב\"), משחקי צליל, וסדרה ממוספרת בשם \"אתם פשוט עצלנים\". **[עובדה]** סביב התוכן בנה אתר עם ארכיון מתכונים וממשק חיפוש בשיחה (AI, בגרסת בטא). **[עובדה]**\n\n**הקו המנחה למחקר:** אדרי מחזיק שני מוצרים באותו סרטון: **בידור** (שפה, הומור) ו**שימושיות** (מתכון שעובד). שתי ההצלחות נמדדות אחרת. השאלה למחקר: **איך הוא יודע שמתכון באמת \"נכנס למטבח\", כשאף פלטפורמה לא סופרת מי בישל?** **[פרשנות]**\n\n## 2. קטגוריית יוצר\n\n- **קטגוריה:** אוכל, מתכונים ביתיים, בידור קולינרי. **[עובדה]**\n- **ארכיטיפ:** מדריך נגיש ובדרן מטבח, עם שורשים מקצועיים. **[פרשנות]**\n- **הבחנה חשובה:** בתקשורת קוראים לו לפעמים \"שף\". תיאור מדויק יותר: מתכונאי ויוצר עם ניסיון במסעדנות. לא אומתה הכשרה פורמלית. **[עובדה]**\n- **לא לבלבל:** אחיו התאום איתי אדרי הוא גם יוצר אוכל. **[עובדה]**\n\n## 3. פלטפורמות עיקריות\n\n| ערוץ | מה ידוע | תפקיד (לפי דבריו או משוער) |\n|---|---|---|\n| TikTok `@kobiedri` | ערוץ הפריצה בקורונה **[דיווח]** | אנרגיה \"פרועה\" יותר, לפי תיאורו **[דיווח]** |\n| Instagram `edrikobi` | מקושר מהאתר **[עובדה]** | דגש על מראה המנה והתוצאה, לפי תיאורו **[דיווח]** |\n| YouTube `kobi edri's food` | שם הערוץ אומת, התוכן לא נבדק במלואו **[עובדה]** | לא ידוע: עומק? ארכיון? **[לבדיקה]** |\n| Facebook | נוכחות בתוך קבוצה **[עובדה]** | קהילה **[לבדיקה]** |\n| kobiedri.co.il | ארכיון, קטגוריות, מתכונים כתובים, חיפוש AI בבטא **[עובדה]** | **הנכס היחיד שבאמת שלו**: חיפוש, קריאה ושימוש חוזר |\n| Slice by Foody | משתתף במוצר לימודי **[עובדה]** | הדרכה בתשלום |\n\n**השוואה מועילה (מתוך \"managing channels: food\"):** חן מזרחי (\"Hen in the Kitchen\") מתארת חלוקת עבודה ברורה: Instagram מהיר, YouTube לתהליכי בישול ארוכים שבונים ביטחון, והאתר נושא גם שטחי פרסום. **[דיווח]** אצל אדרי לא ידוע אם יש חלוקה מכוונת כזאת, במיוחד ב-YouTube. **[לבדיקה]**\n\n## 4. קהל ומיצוב\n\n- **לא ידוע:** גודל קהל עדכני לכל ערוץ (יש סדר גודל של מאות אלפים, בלי ספירה מאומתת), דמוגרפיה. **[לבדיקה]**\n- **סוגי שימוש שעולים מתגובות (מדגם קטן):** שאלות התאמה (\"אפשר בלי?\"), כוונת הכנה, דיווחי הצלחה, חיבה, והסתייגות מהמאמץ. **[עובדה, מדגם]**\n- **שלושה סוגי צופים משוערים:** מבשל שמחפש פתרון, צופה שנהנה מהאישיות, ומארח שצריך מנה מרשימה. **[פרשנות]**\n- **היפותזת מיצוב:** \"מתרגם של מטבח ביתי להווה\": בישול שנראה מאיים הופך לרצף שנראה אפשרי. **[פרשנות]**\n\n## 5. אקוסיסטם התוכן\n\n| עמוד תוכן | תפקיד | בידור / שימושיות |\n|---|---|---|\n| ארוחה ביתית ישימה | ליבה חוזרת | שימושיות |\n| סדרת \"אתם פשוט עצלנים\" | פורמט חוזר ממוספר (עד פרק 40 בבדיקה) | שניהם |\n| זיכרון משפחתי | מאכלי ילדות, מתכון של סבא | רגש |\n| חגים ואירוח | מנות גדולות ומאפים | שימושיות + השראה |\n| פטנטים | בצק מוכן, מכשירים, קיצורי דרך | שימושיות + מסחר |\n| משחק קולינרי | צורות ושילובים מפתיעים (רביולי לפורים) | בידור |\n| הדרכה | Slice by Foody | שימושיות בתשלום |\n\n**Hook מכוון:** ב-2024 הסביר שהמלצה \"לא להכין\" מנה מסוימת נועדה לעורר תגובה ומעורבות. **[דיווח]** זה מקרה מתועד של מחשבה על אלגוריתם, לא הוכחה שכל משפט שלו טקטיקה. **[פרשנות]**\n\n## 6. מותג וזהות חזותית\n\n- **צילום אוכל:** מנה במרכז הפריים, כמויות לשיתוף, רקע בהיר, טקסטורה מודגשת (חומים וזהובים). **[עובדה, מדגם קטן]**\n- **דמות מאוירת באתר:** הבעה מוגזמת, כובע טבח, טלפון ואוכל בתנועה. **[עובדה]**\n- **חלוקת תפקידים חזותית:** ההגזמה מושכת ומזהה; צילום המנה מראה תוצאה שאפשר לרצות. **[פרשנות]**\n- **הקול כחלק מהממשק:** שפת הדמות מופיעה גם בכפתורים ובשדה החיפוש באתר. **[עובדה]** זה רמז חשוב לגרסה המותאמת אישית: אצלו, המיקרוקופי הוא חלק מהזהות. **[פרשנות]**\n- **סביבת צילום:** כתבת עיצוב מתארת בית שהותאם לצילום. **[דיווח]**\n\n## 7. אסטרטגיית פלטפורמות וערוצים\n\n**אוכל ביוטיוב, בטיקטוק ובאינסטגרם מתנהג אחרת.** **[פרשנות, מבוסס על \"managing channels: food\" ועל דבריו]**\n\n| שאלה | למה היא חשובה אצל יוצר אוכל |\n|---|---|\n| קצר מול ארוך | סרטון קצר מעורר תיאבון; מתכון מלא דורש זמן או טקסט. איפה אדרי שם את המתכון המלא? (תשובה חלקית: באתר) |\n| גילוי מול חיפוש | TikTok ו-Reels מביאים צופים חדשים; מתכון נמצא גם דרך חיפוש (באתר, ביוטיוב, ובפלטפורמות עצמן). **[פרשנות]** |\n| בידור מול שימושיות | צפייה יכולה להצליח בגלל הבדיחה; שמירה וכניסה למתכון המלא מעידות על כוונת בישול |\n| אותו מתכון בכמה ערוצים | האם הוא משכפל, מתאים או מפצל? **[לבדיקה]** |\n| תדירות | סדרה ממוספרת יוצרת קצב קבוע; קצב הפרסום בפועל לא נמדד **[לבדיקה]** |\n\n**האתר הוא הנכס הייחודי שלו:** מתכון כתוב, ארכיון וחיפוש. רוב יוצרי האוכל בפרויקט לא מחזיקים נכס כזה. **[פרשנות]** אצל יוצרים אחרים (כמו לורן ליב צרור) אתרים חיצוניים מחלצים את המתכון מהסרטון בלי היוצרת. **[עובדה ללורן]**\n\n## 8. יחסי קהל וקהילה\n\n- **לולאת משוב מתועדת:** בפרק 38 סיפר שמתכון פורסם בעקבות עניין שעלה אחרי Story. **[דיווח]**\n- **עבודת קהילה כחלק מהעבודה:** הוא עצמו מזכיר תחזוקת ערוצים, מענה לעוקבים ותגובות כחלק מהשגרה. **[דיווח, Mako 2026]**\n- **מה לא נבדק:** איך הוא מתקן טעות במתכון, מתמודד עם ביקורת, או כמה זמן לוקח לו לענות. **[לבדיקה]**\n- **אמון שימושי:** אמון אצל יוצר אוכל נבנה מהצלחה במטבח, לא רק מאישיות. **[פרשנות]**\n\n## 9. מודל עסקי ומוניטיזציה\n\n| שכבה | מה ידוע | מעמד |\n|---|---|---|\n| תוכן ממותג | אסם, שמרית, משק יעקבס, Food Appeal, נינג׳ה; שיתופים מוקדמים: שופרסל, שטראוס, נינג׳ה, צוריאל | **[עובדה]** |\n| הדרכה | Slice by Foody | **[עובדה]** |\n| מדיה | ראיונות, מתכונים בכלי תקשורת | **[עובדה]** |\n| אתר | ארכיון, חיפוש. לא ידוע אם יש בו פרסום | **[לבדיקה]** |\n| ספר | כוונה היסטורית, לא אומת שיצא | **[לבדיקה]** |\n| מוצר בבעלות | לא אומת | **[לבדיקה]** |\n\n- **דיווח עצמי חשוב:** במאי 2026 תיאר עלייה ניכרת במשקל התוכן המסחרי ביחס לעבר. **[דיווח]** זה לא אומר שהקהל איבד אמון; זו שאלה. **[פרשנות]**\n- **מחלוקת מסחרית:** ב-2026 דיווח Ynet על מחלוקת בינו לבין חברת פרסום. **[דיווח]** אין כאן קביעה מי צודק. היא מלמדת על מנגנוני עבודה: עסקאות תוכן ממותג, סוכנויות, תוצרים מוסכמים ולוחות תשלום. **[פרשנות]**\n- **מבחן התאמה מסחרית:** אם מורידים את שם המותג מהסרטון, האם נשארת סיבה טובה לצפות? **[פרשנות]**\n\n**הזדמנויות מוניטיזציה ליוצר אוכל (מתוך \"managing channels: food\"):** **[פרשנות, לא תיאור של מה שאדרי עושה]**\n- שטחי פרסום באתר מתכונים (כמו חן מזרחי).\n- שיתופי פעולה עם מסעדות ועסקי אירוח. לפי Deloitte, עבודה עם יוצרים היא הטקטיקה השנייה ברווחיותה למסעדות. אצל אדרי לא מתועדים שיתופים עם מסעדות. **[לבדיקה]**\n- הפיכת קורס או אתר לעסק מדיה רחב יותר (כמו TelavEat, שהתחיל כעמוד אינסטגרם והפך לבלוג ומדיה).\n\n## 10. שיתופי פעולה ושותפויות\n\n- **סוגי שילוב:** מרכיב ממותג בתוך מתכון (אסם, שמרית), כלי או מכשיר שמשנה את התהליך (נינג׳ה, Food Appeal). **[עובדה]**\n- **דוגמת בורקס שמרית:** פירוט שמסביר בחירה טכנית ולא רק מציג אריזה. **[עובדה]** האם הטיפ נשאר שימושי למי שמחליף מותג? **[לבדיקה]**\n- **צד הסוכנות:** המחלוקת המדווחת ב-2026 מראה שיש שכבת סוכנויות בין המותג ליוצר. **[פרשנות]** מי מנהל אצלו את העסקאות? **[לבדיקה]**\n- **אין מספיק ראיות** כדי לקבוע אילו מותגים הוא לעולם לא יעבוד איתם. **[עובדה]**\n\n## 11. ביצועים ואנליטיקה\n\n**אצל יוצר אוכל, צפייה ובישול הם שתי הצלחות שונות.** **[פרשנות]**\n\n| סוג כלי | מה הוא נותן לאדרי | מה זה אומר על בישול |\n|---|---|---|\n| TikTok Studio | צפיות, זמן צפייה, אחוז צפייה, מקורות תנועה | אם התפוצץ ומאיפה, לא אם בישלו |\n| Insights של אינסטגרם | Reach, **שמירות**, שיתופים, כניסות לפרופיל | שמירה היא הסימן הכי קרוב לכוונת בישול |\n| YouTube Studio | זמן צפייה, שימור לאורך הסרטון, חיפוש, הכנסות (אם יש מונטיזציה) | שימור במתכון ארוך: האם צפו עד שלב הביצוע? |\n| נתוני האתר (Google Analytics או דומה) | כניסות למתכון, זמן בדף, חיפושים | **הכי קרוב לבישול:** מי קרא את הכמויות |\n| חיפוש AI באתר | מה אנשים שואלים | מקור ידע ייחודי על מה שאנשים מנסים לבשל **[לבדיקה: האם הוא רואה את זה?]** |\n| תגובות | \"הכנתי!\", \"אפשר בלי?\" | אותות איכותניים, קשה לספור |\n| נתוני מותגים | תוצאות קמפיין | אצל המותג או הסוכנות |\n\n**הפער המרכזי:** כל אות נמצא במקום אחר, ואין דרך לחבר \"הסרטון בטיקטוק\" ל\"הכניסה למתכון באתר\" ל\"התגובה הכנתי\". **[פרשנות]**\n\n## 12. תהליך עבודה ואתגרי ניהול\n\n**תהליך העבודה של יוצרי אוכל (לפי מחקר אקדמי על foodie influencers):** תכנון ← צילום ← עריכה ← פרסום ← ניהול מעורבות, כולל החלטות על האשטגים, כיתובים, תיוגים ותזמון. **[עובדה למחקר הכללי]**\n\n**איך זה נראה אצל אדרי (משוער):** **[פרשנות]**\n- פיתוח מתכון ובדיקה שהוא עובד.\n- צילום (בבית שהותאם לצילום).\n- עריכה לכמה פורמטים: קצר ופרוע לטיקטוק, יפה לאינסטגרם, אולי ארוך ליוטיוב.\n- כתיבת המתכון לאתר, בשפה שלו.\n- פרסום בארבעה ערוצים + אתר.\n- מענה לשאלות התאמה ולתגובות.\n- עבודה מול מותגים וסוכנויות: בריף, אישור, תוצרים, תשלום.\n\n**מסגרת שימושית:** \"היוצר מחזיק את תשומת הלב והאמון; מנהל הסושיאל הופך את תשומת הלב למערכת שחוזרת על עצמה\". **[עובדה, מתוך \"managing channels: food\"]** האם יש לאדרי מנהל כזה? **[לבדיקה]**\n\n## 13. מתחים, פערים והזדמנויות מרכזיים\n\n| מתח | למה זה מעניין |\n|---|---|\n| קלות מול מאמץ | \"קשה? לא קשה!\" מול מתכונים ארוכים. מה \"קל\" אומר: מעט פעולות, מעט טעויות או מעט פחד? |\n| בידור מול הוראה | מתי הבדיחה מפריעה להבנה? |\n| צפייה מול בישול | סרטון ויראלי שאף אחד לא בישל: הצלחה או כישלון? |\n| שירות לקהל מול שירות למותג | מי קובע מה נכנס למנה? |\n| מסחר גדל | הוא עצמו אומר שהמסחר גדל. איך הוא יודע שהקהל בסדר עם זה? |\n| פורמט מזוהה מול התחדשות | הסדרה והביטויים הם נכס, אבל גם התחייבות |\n| קול אישי מול ממשק AI | חיפוש באתר \"נשמע כמוהו\". מי אחראי לתשובה שגויה? |\n\n**הזדמנויות:** חיבור בין אותות בישול מכמה מקומות; הבנת מה אנשים מחפשים באתר; השוואת אותו מתכון בין ערוצים. **[פרשנות]**\n\n## נספח א׳: קול ושפה (לסימולציה בכלי הראיונות)\n\n- **ביטויים מזוהים:** \"קשה? לא קשה!\", \"יאבלולו שמבלולו\", \"צ׳לה בלה\", \"תקנו סוטאז׳\".\n- **חזרות:** \"ערבב ערבב\", \"הרבה. הרבה. הרבה.\"\n- **פעלים ישירים** ומשפטי פעולה קצרים.\n- **הומור:** משחקי צליל, אתגור רך (\"אתם פשוט עצלנים\"), היפוך ציפייה, הגזמה.\n- **סקאלות (1 עד 10):** יומיומי 9, מקרב 8, משחקי 8, מוחצן 8, חברי יותר ממומחה 7.", "photo": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD//gA7Q1JFQVRPUjogZ2QtanBlZyB2MS4wICh1c2luZyBJSkcgSlBFRyB2ODApLCBxdWFsaXR5ID0gOTAK/9sAQwAGBAQFBAQGBQUFBgYGBwkOCQkICAkSDQ0KDhUSFhYVEhQUFxohHBcYHxkUFB0nHR8iIyUlJRYcKSwoJCshJCUk/9sAQwEGBgYJCAkRCQkRJBgUGCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQk/8AAEQgAwADAAwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBAMFBQQEAAABfQECAwAEEQUSITFBBhNRYQcicRQygZGhCCNCscEVUtHwJDNicoIJChYXGBkaJSYnKCkqNDU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6g4SFhoeIiYqSk5SVlpeYmZqio6Slpqeoqaqys7S1tre4ubrCw8TFxsfIycrS09TV1tfY2drh4uPk5ebn6Onq8
