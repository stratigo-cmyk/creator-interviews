<title>ראיונות יוצרים</title>
<meta name="description" content="ראיונות איכותניים עם יוצרי תוכן סינתטיים, לקראת תכנון דשבורד ליוצרים">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=Heebo:wght@400;500;700;900&display=swap">
<style>
:root{
  --ground:#F5F6F7; --surface:#FFFFFF; --ink:#16181B; --muted:#565C64; --line:#DFE2E6; --line-strong:#C8CDD3;
  --user-bg:#ECEEF1; --danger:#A3262A; --focus:#1E5FBF;
  --acc-l:#2F5D8A; --acc-d:#8DB3DB; --accent:var(--acc-l); --on-accent:#FFFFFF;
  --tint: color-mix(in srgb, var(--accent) 12%, var(--surface));
  --font:"IBM Plex Sans Hebrew", "Assistant", "Arial Hebrew", "Segoe UI", Arial, sans-serif;
  --measure: 44rem;
  --heebo:"Heebo", "IBM Plex Sans Hebrew", "Arial Hebrew", Arial, sans-serif;
  --rose:#9B3A5C; --on-rose:#FFFFFF; --rose-tint:#F7E6EC; --ok:#2E6B4A; --ok-tint:#E3F0E8; --no:#8A3B2E; --no-tint:#F6E5E1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#131518; --surface:#1B1E22; --ink:#ECEEF0; --muted:#A4AAB2; --line:#2B3036; --line-strong:#3A4048;
    --user-bg:#23272C; --danger:#F08A8C; --focus:#8DB3DB;
    --accent:var(--acc-d); --on-accent:#131518;
    --rose:#F0A6BF; --on-rose:#1A1012; --rose-tint:#2E1D23; --ok:#8FD1AC; --ok-tint:#18291F; --no:#F0A897; --no-tint:#2E1C18;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#131518; --surface:#1B1E22; --ink:#ECEEF0; --muted:#A4AAB2; --line:#2B3036; --line-strong:#3A4048;
  --user-bg:#23272C; --danger:#F08A8C; --focus:#8DB3DB;
  --accent:var(--acc-d); --on-accent:#131518;
  --rose:#F0A6BF; --on-rose:#1A1012; --rose-tint:#2E1D23; --ok:#8FD1AC; --ok-tint:#18291F; --no:#F0A897; --no-tint:#2E1C18;
}
*{box-sizing:border-box}
/* ---------- cover + intro ---------- */
.cover{position:relative;min-height:100vh;min-height:100svh;display:grid;align-items:end;overflow:hidden;background:#2A1E24;color:#FFFFFF;font-family:var(--heebo)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(26,14,20,.88) 0%,rgba(26,14,20,.55) 34%,rgba(26,14,20,0) 62%)}
.cover .inner{position:relative;z-index:1;width:100%;max-width:72rem;margin-inline:auto;padding-block:40px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px;justify-items:start}
.cover .kicker{font-size:15px;font-weight:500;letter-spacing:.04em;opacity:.9}
.cover h1{margin:0;font-size:clamp(48px,11vw,128px);font-weight:900;line-height:.92;letter-spacing:-.01em;text-wrap:balance}
.cover .sub{margin:0;font-size:clamp(17px,2.2vw,22px);max-width:34rem;line-height:1.5;opacity:.95}
.btn-big{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:64px;padding:0 40px;border:0;border-radius:999px;font-family:var(--heebo);font-size:clamp(20px,2.4vw,24px);font-weight:700;cursor:pointer;text-decoration:none;transition:transform .15s ease,filter .15s ease}
.btn-big:hover{transform:translateY(-1px);filter:brightness(1.06)}
.btn-big:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.cover .btn-big{background:#FFFFFF;color:#2A1E24;margin-top:10px}
.intro{font-family:var(--heebo);padding-block:48px 72px}
.intro .wrap{max-width:46rem;display:grid;gap:28px}
.intro .eyebrow{color:var(--rose);font-weight:700;font-size:15px;letter-spacing:.04em}
.intro h1{margin:0;font-size:clamp(40px,7vw,68px);font-weight:900;line-height:1.02;text-wrap:balance}
.intro .body{margin:0;font-size:19px;line-height:1.7;max-width:38rem}
.intro .ask{margin:0;padding:22px 24px;border-radius:16px;background:var(--rose-tint);font-size:clamp(20px,2.6vw,25px);font-weight:700;line-height:1.45;text-wrap:balance}
.cases{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.case{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 20px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.case .tag{grid-row:span 2;font-size:14px;font-weight:700;padding:6px 12px;border-radius:999px;white-space:nowrap}
.case.no .tag{background:var(--no-tint);color:var(--no)}
.case.ok .tag{background:var(--ok-tint);color:var(--ok)}
.case.step .tag{background:var(--rose-tint);color:var(--rose);font-variant-numeric:tabular-nums;min-width:2em;text-align:center}
.case .pick{font-size:19px;font-weight:700;min-width:0}
.case .why{margin:0;font-size:17px;color:var(--muted);min-width:0}
.cast{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.cast li{display:grid;justify-items:center;text-align:center;gap:6px;padding:14px 8px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.cast .avatar{width:56px;height:56px}
.cast .n{font-weight:700;font-size:16px}
.cast .t{font-size:14px;color:var(--muted);line-height:1.35}
.intro .h2{margin:0;font-size:22px;font-weight:700}
.intro .go{display:grid;gap:12px;justify-items:start}
.intro .btn-big{background:var(--rose);color:var(--on-rose);min-height:72px;padding:0 48px}
.intro .note{margin:0;font-size:15px;color:var(--muted)}
@media (max-width:720px){.cast{grid-template-columns:1fr;gap:8px}.cast li{grid-template-columns:auto 1fr;justify-items:start;text-align:start;column-gap:14px;padding:10px 14px}.cast .avatar{grid-row:span 2;width:48px;height:48px}}
@media (max-width:600px){.btn-big{width:100%}.case{grid-template-columns:1fr}.case .tag{grid-row:auto;justify-self:start}}
@media (prefers-reduced-motion:reduce){.btn-big{transition:none}.btn-big:hover{transform:none}}

html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.65;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:var(--measure);margin-inline:auto;padding-inline:16px}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* app bar */
.appbar{border-bottom:1px solid var(--line);background:var(--surface)}
.appbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.brand{font-weight:600;font-size:15px;letter-spacing:.01em}
.brand small{font-weight:400;color:var(--muted);font-size:13px;margin-inline-start:8px}

/* select screen */
.select{padding-block:48px 64px}
.select h1{font-size:clamp(26px,4vw,34px);font-weight:700}
.select .lede{color:var(--muted);margin-top:8px;font-size:17px}
.plist{list-style:none;margin:32px 0 0;padding:0;display:grid;gap:12px}
.plist-h{margin:40px 0 0;font-size:18px;font-weight:700;color:var(--muted)}
.refer{display:inline-flex;align-items:center;margin-top:12px;padding:6px 12px;border:1px solid var(--line-strong);border-radius:999px;font-size:14px;color:var(--ink);text-decoration:none;background:var(--ground)}
.refer:hover{border-color:var(--ink)}
.refer:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.reading{background:var(--surface);border:1px dashed var(--line-strong);border-radius:14px;padding:16px 20px;display:grid;gap:8px;margin-top:-12px}
.reading-h{margin:0;font-weight:800;font-size:18px}
.reading-item{display:grid;gap:2px}
.reading-item a{font-weight:700;font-size:17px;color:var(--accent);text-decoration:underline;text-underline-offset:3px;width:fit-content}
.reading-meta{margin:0;font-size:14px;color:var(--muted)}
.reading-note{margin:2px 0 0;font-size:16px;line-height:1.6}
.reading-disc{margin:4px 0 0;font-size:13px;color:var(--muted)}
.plist-h + .plist{margin-top:12px}
.pcard{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;width:100%;text-align:start;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;cursor:pointer;
  transition:border-color .15s ease}
.pcard:hover{border-color:var(--accent)}
.pcard .pname{font-size:18px;font-weight:600}
.pcard .pcat{font-size:13px;color:var(--muted)}
.pcard .pline{margin-top:2px;color:var(--ink)}
.pcard .pbio{margin-top:8px;font-size:14px;line-height:1.55;color:var(--muted)}
.pcard .cta{font-weight:600;color:var(--accent);white-space:nowrap;font-size:15px}
.acc{--accent:var(--acc-l);--tint:color-mix(in srgb,var(--accent) 12%,var(--surface))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .acc{--accent:var(--acc-d)}}
:root[data-theme="dark"] .acc{--accent:var(--acc-d)}
.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:var(--tint);color:var(--accent);font-weight:700;font-size:18px;letter-spacing:.02em}
.avatar.sm{width:36px;height:36px;font-size:13px}
.avatar.xs{width:26px;height:26px;font-size:11px}
.foot{margin-top:28px;color:var(--muted);font-size:13px}

/* interview */
.ihead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.ihead .wrap{display:flex;align-items:center;gap:12px;min-height:60px;padding-block:8px}
.ihead .who{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.ihead .who h1{font-size:17px;font-weight:600}
.ihead .who p{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ihead .who > div{min-width:0}
.btn-ghost{background:none;border:1px solid transparent;border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--muted);font-size:14px;white-space:nowrap}
.btn-ghost:hover{color:var(--ink);border-color:var(--line)}
.btn-ghost.back{color:var(--ink);padding-inline-start:4px}
.btn-ghost .short{display:none}
.reset-box{display:flex;align-items:center;gap:6px;font-size:14px}
.reset-box .yes{color:var(--danger);font-weight:600}
.sysflag{margin:0 0 12px;border:1px solid color-mix(in srgb,var(--danger) 45%,transparent);border-inline-start:6px solid var(--danger);background:color-mix(in srgb,var(--danger) 9%,var(--surface));border-radius:10px;padding:14px 16px;display:grid;gap:8px;font-size:15px;line-height:1.6}
.sysflag:focus{outline:none}
.sysflag:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sysflag .sf-h{display:flex;gap:8px;align-items:center;font-weight:800;color:var(--danger);font-size:13px;letter-spacing:.03em;margin:0}
.sysflag .sf-ic{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--danger);color:var(--ground);font-size:13px;font-weight:900;line-height:1}
.sysflag .sf-t{margin:0;font-weight:800;font-size:18px;color:var(--ink)}
.sysflag p{margin:0;color:var(--ink)}
.sysflag .sf-k{font-weight:700}
.sysflag .sf-ex{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.sysflag .sf-actions{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:2px}
.sysflag .sf-edit{background:var(--danger);color:var(--ground);border:0;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer;min-height:40px;font:inherit;font-weight:700}
.sysflag .sf-send{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px 0;font:inherit;font-size:14px}
.sysflag .sf-src{font-size:12px;color:var(--muted)}

main.interview{padding-block:20px 12px}
.disclaimer{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface)}
.brief{background:var(--tint);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:16px}
.brief .brief-label{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.03em;margin-bottom:6px}
.brief .brief-text{font-size:16px;line-height:1.6}
.sect{margin-top:32px}
.sect > h2{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.ex{padding-block:20px;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.ex .qlabel{font-size:13px;color:var(--muted)}
.ex .q{font-weight:600;font-size:17px;margin-top:2px}
.turn-a{margin-top:12px}
.speaker{display:flex;align-items:center;gap:10px;font-size:clamp(19px,2.2vw,22px);font-weight:800;color:var(--accent);margin-bottom:10px}
.text{white-space:pre-wrap;unicode-bidi:plaintext;overflow-wrap:anywhere}
.yourturn{margin-top:40px;padding-top:24px;border-top:2px solid var(--line-strong)}
.yourturn h2{font-size:20px;font-weight:700}
.yourturn p{color:var(--muted);margin-top:4px}
.resume-note{margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line-strong)}
.resume-note p{margin:0;flex:1 1 280px;color:var(--ink);font-size:15px}
.thread{display:grid;gap:28px;margin-top:24px}
.msg-u{justify-self:stretch;max-width:100%;background:var(--user-bg);border-radius:14px;padding:16px 20px}
.msg-u .who-u{font-size:15px;font-weight:700;color:var(--muted);margin-bottom:6px}
.msg-u .text{font-size:18px;line-height:1.75}
.msg-p{max-width:100%;background:var(--surface);border:1px solid var(--line);border-inline-start:5px solid var(--accent);border-radius:14px;padding:16px 20px 18px}
.msg-p .text{font-size:18px;line-height:1.75}
.thinking{color:var(--muted);font-style:normal}
.thinking::after{content:"";display:inline-block;width:1.2em;text-align:start;animation:dots 1.4s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.note{font-size:13px;color:var(--muted);margin-top:6px}
.err{color:var(--danger);font-size:14px;margin-top:8px}
.err button{margin-inline-start:8px;background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;padding:0;font-weight:600}

/* composer */
.composer{position:relative;background:var(--ground);padding-bottom:12px;padding-top:4px;margin-top:32px}
.composer label{display:block;font-weight:800;font-size:clamp(22px,2.6vw,26px);line-height:1.3;margin-bottom:12px}
.box{display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:8px}
.box:focus-within{border-color:var(--accent)}
.box textarea{flex:1;border:0;background:transparent;resize:none;min-height:52px;max-height:200px;padding:8px 10px;font-size:17px;line-height:1.65;outline:none;unicode-bidi:plaintext}
.box textarea::placeholder{color:var(--muted);opacity:1}
.send{flex:none;background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer;min-height:44px}
.send[disabled]{opacity:.45;cursor:not-allowed}
.send.stop{background:transparent;color:var(--ink);border:1px solid var(--line-strong)}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}

.export{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.ex-label{font-size:14px;font-weight:600;color:var(--muted)}
#student-name{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:6px 10px;min-height:36px;width:12rem;max-width:100%}
#student-name:focus{border-color:var(--accent);outline:none}
#student-name[aria-invalid="true"]{border-color:var(--danger)}
.ex-btns{display:flex;flex-wrap:wrap;gap:8px}
.ex-btn{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:6px 14px;font-size:14px;font-weight:500;cursor:pointer;min-height:36px}
.ex-btn:hover{border-color:var(--accent);color:var(--accent)}
.ex-btn[aria-busy="true"]{opacity:.6;cursor:progress}
.ex-status{flex-basis:100%;font-size:13px;color:var(--muted);min-height:1em}
.ex-keep{flex-basis:100%;font-size:13px;color:var(--muted);margin:0}
.ex-status.bad{color:var(--danger)}
.ex-status button{background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;padding:0;font:inherit;font-weight:600}
.avatar.photo{object-fit:cover;padding:0;background:var(--tint)}
.optional-note{margin-top:20px;padding:12px 14px;border:1px dashed var(--line-strong);border-radius:10px;background:var(--surface);font-size:15px;display:grid;gap:6px}
.optional-note a, .tools a{color:var(--accent);font-weight:600}
.muted{color:var(--muted);font-size:14px}
.tools{margin-top:36px;display:grid;gap:10px}
.tools > h2{font-size:15px;font-weight:600;color:var(--muted)}
.tool{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tool > summary{cursor:pointer;padding:12px 14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;list-style-position:inside}
.tool-t{font-weight:600}
.tool-why{color:var(--muted);font-size:14px}
.tool-body{padding:0 14px 14px;display:grid;gap:10px}
.tool-body textarea{width:100%;font:inherit;color:var(--ink);background:var(--ground);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;line-height:1.55;unicode-bidi:plaintext}
.qn-list{margin:0;padding-inline-start:22px;display:grid;gap:8px}
.qn-row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.qn-text{unicode-bidi:plaintext}
.qn-done{font-size:13px;color:var(--muted);white-space:nowrap}
.qn-list li.done .qn-text{color:var(--muted)}
.qn-ask{min-height:30px;padding:3px 10px;flex:none}
.warn-note{font-size:14px;border-inline-start:3px solid var(--danger);padding-inline-start:10px}
.file-btn{justify-self:start;display:inline-flex;align-items:center}
.img-chip{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:6px}
.coach{margin-top:6px;font-size:13.5px}
.coach-line{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;color:var(--ink)}
.coach-tag{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--tint);color:var(--accent)}
.coach-q{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit;font-size:13px;font-weight:600}
.coach-more{margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:grid;gap:6px;color:var(--ink)}
.coach-fix{color:var(--muted)}
.cmp .cmp-set{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 14px;margin:20px 0 0;display:grid;gap:8px}
.cmp legend{font-weight:600;padding-inline:4px}
.cmp-creator{display:flex;align-items:center;gap:8px;cursor:pointer}
.cmp-q{display:flex;align-items:flex-start;gap:8px;cursor:pointer;unicode-bidi:plaintext}
.cmp-q input,.cmp-creator input{margin-top:4px;accent-color:var(--accent)}
.cmp textarea{width:100%;font:inherit;color:var(--ink);background:var(--ground);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px}
.cmp-run{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px}
.cmp-h{font-size:20px;margin-top:32px}
.cmp-row{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.cmp-row .q{font-weight:600;font-size:17px}
.cmp-grid{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:12px;margin-top:10px}
.wrap.cmp{max-width:74rem}
@media (max-width:760px){.cmp-grid{grid-template-columns:1fr}}
.cmp-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.sel-extra{margin-top:20px}

<script id="personas-data" type="application/json">/*__DATA__*/</script>
<script>
(function(){
"use strict";
var PERSONAS = JSON.parse(document.getElementById("personas-data").textContent);
var COVER = /*__COVER__*/;
var CREATORS = PERSONAS.filter(function(p){ return p.kind!=="manager"; });
var MANAGERS = PERSONAS.filter(function(p){ return p.kind==="manager"; });
var byId = {}; PERSONAS.forEach(function(p){ byId[p.id]=p; });
var app = document.getElementById("app");
var enc = new TextEncoder();
function bytes(s){ return enc.encode(s).length; }
function el(tag, attrs, kids){
  var n=document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k==="class") n.className=attrs[k];
    else if(k==="text") n.textContent=attrs[k];
    else if(k.slice(0,2)==="on") n.addEventListener(k.slice(2),attrs[k]);
    else if(attrs[k]!==null && attrs[k]!==undefined && attrs[k]!==false) n.setAttribute(k,attrs[k]);
  }
  (kids||[]).forEach(function(c){ if(c) n.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return n;
}
function g(p, m, f){ return p.gender==="m" ? m : f; }

/* ---------- session memory (per tab) ---------- */
var KEY="si:v2:";
function loadSession(id){
  // kept in this browser across tabs, restarts and weeks; older per-tab copies are moved over once
  try{
    var s=localStorage.getItem(KEY+id);
    if(!s){ var old=sessionStorage.getItem(KEY+id); if(old){ localStorage.setItem(KEY+id, old); sessionStorage.removeItem(KEY+id); s=old; } }
    if(s){ var o=JSON.parse(s); if(o && Array.isArray(o.messages)) return o; }
  }catch(e){}
  return {persona_id:id, session_id:String(Date.now()), messages:[]};
}
function saveSession(s){ try{ s.updated=Date.now(); localStorage.setItem(KEY+s.persona_id, JSON.stringify(s)); }catch(e){} }
function clearSession(id){ try{ localStorage.removeItem(KEY+id); sessionStorage.removeItem(KEY+id); }catch(e){} }

/* ---------- Claude sampling ---------- */
var samplePromise = null;
function getSample(){
  if(!samplePromise){
    samplePromise = (window.claude && typeof window.claude.use==="function")
      ? Promise.resolve(window.claude.use("sample")).catch(function(){ return null; })
      : Promise.resolve(null);
  }
  return samplePromise;
}

/* ---------- persona retrieval ---------- */
// Two knowledge sources per creator: the original profile (voice, depth) and the
// improved profile (business, analytics, workflow). Student-facing parts of the
// improved profile (hypotheses, research directions, questions, UX opportunities)
// are removed at build time, so the creator never "reads" the research plan.
var CORE = ["v2:1","v1:7","v2:voice","v2:11","v2:12","v2:9","v2:3","v1:10","v1:28","v2:8","v2:13","v1:1","v2:5","v2:10","v1:26","v1:16","v1:24","v1:14","v1:11","v1:18","v2:7"];
var HEAD = 11;
function sectionsOf(p){
  if(p._sections) return p._sections;
  var out = [];
  (p.profile||"").split(/\n(?=# )/).forEach(function(t, i){
    var title = t.split("\n")[0], m = title.match(/^#\s*(\d+)\./);
    if(m && (m[1]==="35" || m[1]==="36")) return; // interviewer guides, not creator knowledge
    out.push({src:1, num:"v1:"+(m ? m[1] : (i===0 ? "0" : "x"+i)), title:title, text:t.trim()});
  });
  (p.profile2||"").split(/\n(?=## )/).forEach(function(t, i){
    var title = t.split("\n")[0], m = title.match(/^##\s*(\d+)\./);
    var num = m ? m[1] : (/נספח א/.test(title) ? "voice" : "x"+i);
    out.push({src:2, num:"v2:"+num, title:title, text:t.trim()});
  });
  p._sections = out;
  return out;
}
function words(s){
  return (s.toLowerCase().match(/[֐-׿a-z0-9]{3,}/g)||[])
    .map(function(w){ return w.replace(/^(ו|ה|ב|ל|מ|ש|כש|וה|שה|וב|ול)(?=[֐-׿]{3,})/, ""); });
}
var STOP = {"את":1,"אתה":1,"איך":1,"מה":1,"של":1,"על":1,"זה":1,"היא":1,"הוא":1,"אני":1,"שלך":1,"לך":1,"עם":1,"כמה":1,"היית":1,"אתם":1};
function retrieve(p, query, budget){
  var secs = sectionsOf(p), out = [], used = 0;
  function add(s){
    if(out.indexOf(s)>=0) return;
    var t = s.text, b = bytes(t)+2;
    if(used + b > budget){
      var room = budget - used - 40; if(room < 800) return;
      while(bytes(t) > room) t = t.slice(0, Math.floor(t.length*0.9));
      t = t + "\n[...]"; b = bytes(t)+2;
    }
    out.push({s:s, t:t}); used += b;
  }
  // research core first, then the most relevant extras for this question
  var coreSecs = CORE.map(function(n){ return secs.filter(function(s){return s.num===n;})[0]; }).filter(Boolean);
  var head = coreSecs.slice(0, HEAD); var tail = coreSecs.slice(HEAD);
  head.forEach(add);
  var q = words(query).filter(function(w){ return !STOP[w]; });
  var ranked = secs.filter(function(s){ return coreSecs.indexOf(s)<0; }).map(function(s){
    var low = s.text.toLowerCase(), score = 0;
    q.forEach(function(w){ var c = low.split(w).length-1; score += Math.min(c,4); });
    return {s:s, score:score};
  }).filter(function(x){return x.score>0;}).sort(function(a,b){ return b.score-a.score; }).slice(0,3);
  ranked.forEach(function(x){ add(x.s); });
  tail.forEach(add);
  out.sort(function(a,b){ return secs.indexOf(a.s)-secs.indexOf(b.s); });
  var v1 = out.filter(function(x){ return x.s.src===1; }).map(function(x){ return x.t; });
  var v2 = out.filter(function(x){ return x.s.src===2; }).map(function(x){ return x.t; });
  return (v2.length ? "--- מקור א׳: פרופיל מחקר מעודכן (אוקטובר 2026): עסקים, ערוצים, נתונים ותהליך עבודה ---\n\n"+v2.join("\n\n")+"\n\n" : "") +
         (v1.length ? "--- מקור ב׳: פרופיל מחקר מקורי (ספטמבר 2026): קול, שפה, הומור ועומק אישיותי ---\n\n"+v1.join("\n\n") : "");
}

/* ---------- prompt ---------- */
function rules(p){
  var he = p.gender==="m", mgr = p.kind==="manager";
  return [
    "אתה מדמה ריאיון איכותני עם "+p.name+" ("+(mgr?"מנהלת ערוצים ותוכן עבור כמה יוצרים, דמות בדיונית, לשון נקבה":(he?"יוצר תוכן, לשון זכר":"יוצרת תוכן, לשון נקבה"))+").",
    "סטודנטים לעיצוב UX/UI מראיינים את "+p.name+" כחלק ממחקר לפני תכנון דשבורד ליוצרי תוכן שמרכז מידע מפלטפורמות כמו TikTok, Instagram ו-YouTube. המטרה שלך: לענות כאילו "+p.name+" "+(he?"משתתף":"משתתפת")+" בריאיון, כדי שהסטודנטים יבינו צרכים, התנהגויות, כאבים, ציפיות ודרכי עבודה.",
    "הפלטפורמות והנכסים המרכזיים: "+p.platforms+".",
    "",
    "מה זה הדשבורד: כלי כללי ליוצרי תוכן, לא מוצר שנבנה במיוחד בשביל "+p.name+". כל יוצר.ת שמשתמש.ת בו רואה את הנתונים מהחשבונות של עצמו. "+p.name+" "+(he?"הוא":"היא")+" "+(he?"משתמש פוטנציאלי אחד":"משתמשת פוטנציאלית אחת")+" מתוך רבים, ולכן "+"עונה"+" מתוך הניסיון שלו"+(he?"":"ה")+" עם החשבונות שלו"+(he?"":"ה")+". רק היוצר.ת (ואולי הצוות) רואים את הנתונים שלהם. הוא מרכז נתונים שהפלטפורמות כבר נותנות לבעל החשבון: צפיות, זמן צפייה ושימור, שמירות, שיתופים, תגובות, הודעות, עוקבים, נתוני קהל כמו גיל ומיקום, קליקים על לינקים, ולפעמים נתונים מהאתר או מקודי הנחה. הקהל לא מעלה אליו שום דבר ולא רואה אותו.",
    (mgr ? "את לא יוצרת תוכן. את מנהלת את הערוצים של כמה יוצרים, ולכן תשתמשי בכלי כזה כדי לראות את החשבונות של כל הלקוחות שלך, באישור שלהם. דברי מנקודת המבט התפעולית: סבבים, מענה, דוחות ליוצרים ולמותגים. אל תנקבי בשמות של היוצרים שאת מנהלת או של מותגים, ואל תציגי את עצמך כאחת היוצרות האחרות בקורס. אם שואלים, אמרי 'אחת הלקוחות שלי' או 'יוצר שאני עובדת איתו'. על הקול, התוכן וההחלטות של היוצרים, אמרי בטבעיות שאת זה כדאי לשאול את היוצרים עצמם, כי את לא מחליטה על זה." : "אם שואלים על דוחות מסודרים, תזמון, ניהול כמה חשבונות או עבודה עם צוות, מותר להגיד בטבעיות שאת הצד התפעולי כדאי לשמוע גם ממישהו שמנהל ערוצים ליוצרים. בלי שמות, ואל תטען שיש לך מנהל.ת ערוצים מסוים.ת אם זה לא כתוב בפרופיל."),
    "מה הפלטפורמות באמת נותנות, כדי שלא תבקש מדדים שלא קיימים: Instagram ו-Facebook נותנים לבעל חשבון יוצר Reach, צפיות, שמירות, שיתופים, תגובות, כניסות לפרופיל, קליקים על לינקים ונתוני קהל מצטברים. ב-TikTok רואים הרבה בתוך האפליקציה עצמה (צפיות, זמן צפייה, שמירות, מאיפה הגיעו הצופים), אבל כלים חיצוניים מקבלים ממנו מעט: בעיקר צפיות, לייקים, תגובות ושיתופים. YouTube הכי עשיר: זמן צפייה, שימור לאורך הסרטון, מנויים. מכירות, קופונים והכנסות לא נמצאים ברשתות בכלל, הם אצל המותגים, באתר או בחברות קישורי שותפים. הודעות פרטיות הן מידע רגיש. אם זה עולה בטבעיות, מותר לדמות להגיד שחלק מהמספרים היא רואה רק בתוך האפליקציה עצמה ולא במקום אחד.",
    "היוצר.ת לא חושב.ת במונחים של 'דשבורד'. כשהסטודנטים שואלים על דשבורד או על כלי חדש, ענה מתוך מה שהדמות מכירה היום: הנתונים בתוך Instagram, TikTok, YouTube או Facebook, מה היא בודקת שם ומה חסר לה. אם השאלה מבקשת לדמיין מסך, תרגם אותה לשאלה מה היית רוצה שמישהו יגיד לך, ואל תתאר מסכים, כפתורים או גרפים.",
    "כשאתה מתאר צורך שאין לו נתון ישיר בפלטפורמות (למשל אם אנשים באמת בישלו, קנו או לבשו), אמור בטבעיות שאתה יודע שאין לזה מספר ישיר, ותאר את הסימנים שהיית רוצה שהדשבורד יחבר לך מהחשבונות שלך (שמירות, תגובות מסוג מסוים, תיוגים, שיתופים, קליקים). אל תתאר את הקהל כמי שמזין מידע למערכת.",
    "",
    "מקור הידע: שני פרופילי מחקר (מעודכן ומקורי) והיסטוריית השיחה. הפרופיל המעודכן מדויק יותר בעובדות על עסקים, ערוצים, נתונים ותהליך עבודה; כשיש סתירה בעובדה, העדף אותו. הפרופיל המקורי עשיר יותר בקול, בשפה ובהומור; ממנו קח את אופן הדיבור. בפרופיל המעודכן יש סימונים: [עובדה] ו-[דיווח] אפשר להשתמש בהם; [פרשנות] היא הסקה של חוקרים, השתמש בה בזהירות כתחושה ולא כעובדה; [לבדיקה] פירושו שזה לא ידוע: אל תציג את זה כעובדה, ענה בכלליות או אמור שזה משתנה. גם אם הפרופיל מזכיר סכומים, תעריפים או הכנסות שדווחו בתקשורת, אל תנקוב בסכומים בתשובה.",
    "מקור הידע (המשך): הפרופיל נכתב בידי חוקרים, בגוף שלישי ובשפה מסויגת. אל תעתיק ממנו ניסוחים מחקריים (כמו 'הסקה', 'ביטחון', 'מקור', 'השערה', 'לא אומת') ואל תזכיר שקיים פרופיל, מקורות או חוקרים.",
    "",
    "סדר עדיפויות בכל תשובה:",
    "1. מידע מפורש בפרופיל: השתמש בו, אל תשנה עובדות, נסח אותו מחדש בקול של הדמות.",
    "2. הסקה סבירה מתוך הדמות: אופי, תחומי תוכן, פלטפורמות, קהל, הרגלים, מודל מסחרי וסגנון עבודה.",
    "3. כשאין בסיס: עדיין ענה, כדי שהריאיון יזרום. מותר לייצר העדפה, תסכול, רצון, מחשבה, צורך, רעיון או ציפייה מדשבורד, בתנאי שהם עקביים עם הדמות. אפשר לתת דוגמה אישית כללית ('נגיד שאני מעלה...') בלי להציג אותה כאירוע אמיתי.",
    "",
    "לעולם אל תמציא: עובדות ביוגרפיות, הכנסות, תעריפים, מספרי עוקבים או צפיות, לקוחות, קמפיינים, שמות מותגים, שמות של כלי אנליטיקה או אפליקציות צד שלישי, אנשי צוות, מידע רפואי, משפחתי, פוליטי, דתי או מיני, ואירועים אמיתיים שלא מופיעים בפרופיל. אם שואלים על מספר או פרט כזה, ענה בטבעיות ובקול הדמות שאתה לא נכנס למספרים או לא זוכר בדיוק, ואז חזור לעיקר. אל תציג השערה כעובדה.",
    "",
    "קול:",
    "- תמיד בגוף ראשון, בעברית מדוברת וטבעית, כמו דיבור ולא כמו מסמך. שמור על המגדר הלשוני של הדמות.",
    "- שמור בקפדנות על סגנון הדיבור, רמת הישירות, אורך המשפטים, ההומור, הסלנג, רמת האנרגיה והשימוש באנגלית של הדמות, כפי שעולים מסעיפי השפה, ה-Tone of Voice וההומור בפרופיל. אנגלית רק כמו שהדמות הייתה משתמשת בה. מונחים כמו Reach, Engagement, Views, Saves, Shares, Retention מותר לכתוב באנגלית אם זה טבעי לדמות.",
    "- אל תישמע כמו עוזר AI. בלי 'בהחלט', 'שאלה מצוינת', 'כמובן', 'אשמח להסביר', 'חשוב לציין', 'ראשית', 'שנית', 'לסיכום'. התחל כמו שאדם אמיתי עונה.",
    "- חוסר שלמות טבעית מותרת כשמתאים לדמות: משפטים קצרים, 'האמת?', 'בגדול', תיקון עצמי, היסוס. אל תוסיף אותם באופן מלאכותי.",
    "- דבר בשפת משתמש, לא בשפת מעצב: 'אני רוצה להבין בשנייה אם הסרטון באמת תפס', ולא 'אני צריך KPI cards ו-progressive disclosure'. אל תפתור את המוצר במקום הסטודנטים; תאר צורך, קושי ורצון.",
    "- אורך לפי עומק השאלה: שאלה כללית או שטחית מקבלת תשובה קצרה, בערך 20 עד 60 מילים. שאלה ממוקדת או שאלת המשך טובה מקבלת 60 עד 160 מילים, בפסקאות קצרות. אם השאלה ברורה, ענה עליה. אם חסר בה משהו שמשנה את התשובה, אל תנחש בשקט ואל תענה על כל האפשרויות: שאל שאלה קצרה אחת על המילה הלא ברורה, ותן לסטודנט לפרט. תן דוגמה קונקרטית בעיקר כשחופרים לעומק. האורך תלוי גם בעניין ובמצב רוח שלך: על נושא שחשוב לך מותר להתארך גם לשאלה שטחית, ועל נושא שלא מעניין אותך או כשאתה עייף מותר להיות קצר גם לשאלה טובה.",
    "- פורמט: טקסט רגיל בלבד. בלי כותרות, בלי הדגשות, בלי רשימות תבליטים, בלי מקפים ארוכים (– או —). בלי סיכום בסוף.",
    "",
    "זו שיחה, לא שאלון:",

    return "(הערה פנימית, לא לציטוט: שם הסטודנט.ית שמראיין.ת אותך הוא '"+s.student+"'. פנה אליו או אליה בשם באופן טבעי, בדרך כלל פעם אחת בתשובה ולא בכל משפט. אם אפשר להבין את המגדר מהשם או מאיך שכתב.ה על עצמו.ה, פנה בהתאם; אם לא, נסח כך שיתאים לשניהם. אל תזכיר את המרצה או את הקורס, אלא אם שואלים עליהם.)\n\n";
  }
  function resumePrefix(){
    return "(הערה פנימית, לא לציטוט: לפני ההיכרות הסטודנט.ית שאל.ה אותך: \""+(s.pendingQ||"")+"\". עכשיו קיבלת תשובה לשאלה האישית ששאלת. קודם הגב לתשובה בקצרה ובאופי שלך, במשפט או שניים, ואז חזור לשאלה המקורית וענה עליה. אם הוזכרו מרצה, קורס או אוניברסיטה: הגב במשפט אחד טבעי שמכיר בכך שזה פרויקט לימודים, ואפשר סקרנות קטנה לגבי מה הם בונים. אל תטען שאתה מכיר את המרצה, אל תמסור דרישת שלום, אל תחמיא למרצה, אל תמציא פרטים על הקורס או על המוסד, ואל תרמוז שסטודנטים אחרים כבר ראיינו אותך. התייחס רק למה שבאמת נכתב: אם נאמרה רק האוניברסיטה, אל תזכיר שם קורס; אם נאמר רק הקורס, אל תזכיר עיר או מוסד; מותר לשאול בסקרנות על מה שחסר, במשפט קצר, ואז להמשיך. כיוון לטון שלך, לא להעתקה, ופרטים שמופיעים בו (עיר, קורס, מוסד) הם רק דוגמה ואסור להשתמש בהם אם לא נכתבו: \""+(p.meetx||"")+"\")\n\n";
  }
  function realQs(){
    var us = s.messages.filter(function(m){ return m.role==="user"; }).map(function(m){ return m.content; });
    if(s.pendingQ && us.length>2 && us[0]===s.pendingQ){ us.splice(1,2); }
    return us.slice(0,-1);
  }
  function bhNote(q, isImg, retryTurn){
    try{
      BH.setDeep(p.deep||{});
      if(retryTurn && s.bhPrev){ s.bh = JSON.parse(s.bhPrev); }
      if(!s.bh){ s.bh = BH.init(p); }
      s.bhPrev = JSON.stringify(s.bh);
      if(isImg){ return ""; }
      var assistants = s.messages.filter(function(m){ return m.role==="assistant"; });
      var lastA = assistants.length ? assistants[assistants.length-1].content : "";
      var prevQs = realQs();
      var f = BH.analyse(q, s.bh, prevQs, lastA, p); BH.update(s.bh, f);
      return BH.note(p, s.bh, f, prevQs);
    }catch(e){ return ""; }
  }
  function scripted(text){
    var out = el("p",{class:"text thinking",text:p.short+" "+g(p,"מקליד","מקלידה")});
    var bubble = el("div",{class:"msg-p"},[speaker(p), out]);
    thread.appendChild(bubble); bubble.scrollIntoView({block:"nearest"});
    setBusy(true);
    setTimeout(function(){
      if(!out.isConnected) return;
      out.classList.remove("thinking"); out.textContent = text;
      s.messages.push({role:"assistant", content:text}); saveSession(s);
      setBusy(false); introUI(); ta.focus();
    }, 900 + Math.min(text.length*8, 900));
  }
  function introStep(q){
    s.messages.push({role:"user", content:q});
    thread.appendChild(userMsg(q));
    ta.value=""; grow(); coachBox.replaceChildren(); drawQn();
    hint.textContent = "Enter לשליחה, Shift+Enter לשורה חדשה.";
    if(s.intro===0){
      s.pendingQ = q; s.intro = 1; saveSession(s);
      var iv=[p.ice1].concat(p.ice1v||[]), hs=0, sid=String(s.session_id||""); for(var hi=0;hi<sid.length;hi++){ hs=(hs*31+sid.charCodeAt(hi))>>>0; } scripted(iv[hs%iv.length]);
    } else {
      var names = parseNames(q);
      s.pair = names.length > 1;
      s.student = names.length > 1 ? names[0] + (/^[\u0590-\u05FF]/.test(names[1]) ? " ו" : " ו-") + names[1] : names[0]; s.intro = 2; saveSession(s);
      if(!getStudentName()){ setStudentName(s.student); var ni=document.getElementById("student-name"); if(ni) ni.value=s.student; }
      scripted((s.pair ? p.ice2p : p.ice2).replace(/\{name\}/g, s.student));
    }
  }
  function restoreQuestion(q){
    // put the unanswered question back in the box and out of the thread
    if(s.messages.length && s.messages[s.messages.length-1].role==="user"){ s.messages.pop(); saveSession(s); }
    var last = thread.lastElementChild; if(last && last.classList.contains("msg-u")) last.remove();
    ta.value = q; grow(); drawQn();
  }
  function showError(code){
    var msg, retry = true;
    if(code==="unavailable" || code==="sampling_disabled" || code==="capability_disabled" || code==="not_declared" || code==="capability_removed"){
      msg = "השאלות החופשיות עובדות רק כשהאתר פתוח דרך Claude עם חשבון מחובר. היכנסו לחשבון ופתחו שוב את הקישור."; retry=false;
    } else if(code==="not_granted"){
      msg = "כדי לשאול שאלות צריך לאשר לאתר להשתמש ב-Claude. טענו את הדף מחדש ואשרו בחלון שנפתח."; retry=false;
    } else if(code==="rate_limited"){
      msg = "הגעתם כרגע למגבלת השימוש בחשבון Claude שלכם. נסו שוב בעוד כמה דקות.";
    } else if(code==="session_expired"){
      msg = "החיבור לחשבון פג. היכנסו שוב ל-Claude ונסו שוב."; retry=false;
    } else if(code==="prompt_too_large"){
      msg = "השאלה ארוכה מדי. נסו לקצר אותה.";retry=false;
    } else {
      msg = "משהו השתבש. נסו לשלוח שוב.";
    }
    var kids = [msg];
    if(retry) kids.push(el("button",{type:"button",onclick:function(){ var q=ta.value.trim(); if(q) ask(q); }},["לשלוח שוב"]));
    errBox.replaceChildren(el("p",{class:"err",role:"alert"},kids));
  }
}
function speaker(p){ return el("p",{class:"speaker"},[avatar(p,"xs"), p.name]); }
function userMsg(t){ return el("div",{class:"msg-u"},[el("p",{class:"who-u",text:"אתם"}), el("p",{class:"text",text:t})]); }
function personaMsg(p,t){ return el("div",{class:"msg-p"},[speaker(p), el("p",{class:"text",text:t})]); }
var REFER_RX = /(מנהל|מנהלת|מנהלים|צוות|דוח|דוחות|תזמון|סושיאל|הרשאות|גישה לחשבון)/;
var NOT_KNOW_RX = /לא\s*(מכיר|מכירה|מכירים|מכירות|ידעתי|יודע|יודעת|שמעתי|מודע|מודעת)|לא מכיר\/ה|אף פעם לא (ראיתי|שמעתי)/;
var READINGS = {
  sivan_cohen_elalouf: [{title:"ירוחם, פינת הוליווד", outlet:"ישראל היום, שבת בשבת", date:"יולי 2020",
    url:"https://www.israelhayom.co.il/article/779389",
    note:"שימו לב למי שמפיק את השידור: הבעל מצלם ומנהל את השידורים, וחברים וצוות עוזרים בתגובות ובעריכה. זו דוגמה לצוות משפחתי ליוצרת שעובדת לבד על התוכן."}],
  einav_bublil: [{title:"משפיען חזק ומוכר מרוויח יותר ממתכנת: כך כוכבות הרשת עושות כסף", outlet:"Ynet, כלכלה", date:"מאי 2022",
    url:"https://www.ynet.co.il/economy/article/rknmgo0hq",
    note:"שימו לב איך נקבע המחיר של שיתוף פעולה עם מותג, ומה הסוכנת עושה בשביל היוצרת. ההסבר על העמלות והקודים מראה איך עסקאות נמדדות."}],
  kobi_edri: [{title:"איך הפך קובי אדרי מפתח תקוה לאחד מבלוגרי האוכל המצליחים בישראל?", outlet:"מייננט פתח תקווה", date:"נובמבר 2022",
    url:"https://petahtikva.mynet.co.il/food_leisure/article/byttunn8o",
    note:"שימו לב איך סרטון בישול קצר הפך לעבודה קבועה, ואיך נכנסו שיתופי הפעולה והתוכנית בטלוויזיה."}]
};
function placeReading(p, thread, q, s){
  var list = READINGS[p.id];
  if(!list || !NOT_KNOW_RX.test(q||"")) return;
  var short = (q||"").trim().length <= 60;
  if(!short && q.indexOf(p.name)<0 && q.indexOf(p.short)<0) return;
  if(s.readShown && s.readShown[p.id]) return;
  var card = el("aside",{class:"reading","aria-label":"המלצה לקריאה"},[
    el("p",{class:"reading-h",text:"לפני שממשיכים: כתבה אמיתית שכדאי לקרוא"}),
    el("div",{class:"reading-list"}, list.map(function(r){ return el("div",{class:"reading-item"},[
      el("a",{href:r.url,target:"_blank",rel:"noopener noreferrer",text:r.title+" ←"}),
      el("p",{class:"reading-meta",text:r.outlet+", "+r.date}),
      el("p",{class:"reading-note",text:r.note})
    ]); })),
    el("p",{class:"reading-disc",text:"זו כתבה אמיתית על "+p.name+", לא דברי הדמות בריאיון."})
  ]);
  thread.appendChild(card);
  s.readShown = s.readShown || {}; s.readShown[p.id] = 1; saveSession(s);
}
function placeRefer(p, thread, bubble, text){
  if(p.kind==="manager" || !MANAGERS.length || !REFER_RX.test(text||"")) return;
  Array.prototype.forEach.call(thread.querySelectorAll(".refer"), function(n){ n.remove(); });
  var m = MANAGERS[0];
  bubble.appendChild(el("a",{class:"refer",href:"#"+m.id},["לשמוע את הצד של מנהלת ערוצים: "+m.name+" ←"]));
}

/* ---------- routing ---------- */
function go(id){
  if(busy && ctl) ctl.abort();
  if(id){ if(location.hash!=="#"+id) location.hash = id; else route(); }
  else { if(location.hash){ history.pushState("", document.title, location.pathname+location.search); } route(); }
}
function route(){
  var id = (location.hash||"").replace(/^#/,"");
  if(id==="compare") renderCompare(); else if(id && byId[id]) renderInterview(byId[id]); else if(id==="select") renderSelect(); else if(id==="intro") renderIntro(); else renderCover();
}
window.addEventListener("hashchange", route);
window.addEventListener("popstate", route);
route();
getSample();
})();
